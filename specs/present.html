<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAS CDP — Plan Presenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1D1D1D; --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.08);
    --border:rgba(168,168,167,.2); --border2:rgba(236,239,245,.15);
    --red:#DB394C; --red-dim:rgba(219,57,76,.12);
    --text:#FFFFFF; --muted:#A8A8A7; --dim:rgba(255,255,255,.3);
    --green:#4CAF50; --green-dim:rgba(76,175,80,.14);
    --yellow:#F5A623; --yellow-dim:rgba(245,166,35,.12);
    --blue:#4A7FA5; --blue-dim:rgba(74,127,165,.14);
    --radius:8px;
    /* phase accent colors */
    --p0:#A8A8A7; --p1:#DB394C; --p2:#4A7FA5; --p3:#F5A623;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:'Roboto',sans-serif; font-size:13px;
    display:flex; flex-direction:column; overflow:hidden; }
  a { color:inherit; text-decoration:none; }

  /* top bar */
  .bar { display:flex; align-items:center; gap:14px; padding:12px 22px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .brand { font-family:'Unica One',sans-serif; letter-spacing:.06em; color:var(--muted); font-size:14px; }
  .brand b { color:var(--text); font-weight:400; }
  .bar .sep { color:var(--dim); }
  .bar .right { margin-left:auto; display:flex; gap:18px; align-items:center; font-family:'Roboto Mono',monospace; font-size:11px; }
  .bar .right a { color:var(--dim); letter-spacing:.04em; }
  .bar .right a:hover { color:var(--muted); }
  .pos { color:var(--muted); }

  /* stage */
  .stage { flex:1; position:relative; overflow:hidden; }
  .slide { position:absolute; inset:0; padding:30px 46px 16px; display:flex; flex-direction:column;
    opacity:0; transform:translateX(40px); pointer-events:none; transition:opacity .3s, transform .3s; overflow-y:auto; }
  .slide.active { opacity:1; transform:none; pointer-events:auto; }
  .slide-head { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:4px; }
  .slide-ph { font-family:'Roboto Mono',monospace; font-size:12px; letter-spacing:.12em; padding:3px 10px; border-radius:20px;
    border:1px solid currentColor; }
  .slide-title { font-family:'Unica One',sans-serif; font-size:40px; letter-spacing:.03em; text-transform:uppercase; line-height:1; }
  .slide-focus { color:var(--muted); font-size:14px; line-height:1.6; max-width:980px; margin:10px 0 20px; }
  .slide-count { margin-left:auto; font-family:'Roboto Mono',monospace; font-size:11px; color:var(--dim); }

  /* workstream lanes of post-it cards */
  .lanes { display:flex; flex-direction:column; gap:26px; padding-bottom:30px; }
  .lane-h { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .lane-name { font-family:'Roboto Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text); }
  .lane-roll { font-family:'Roboto Mono',monospace; font-size:10px; color:var(--dim); }
  .lane-line { flex:1; height:1px; background:var(--border); }
  .cards { display:flex; flex-wrap:wrap; gap:14px; }

  /* post-it card */
  .pit { width:188px; min-height:118px; padding:13px 14px; border-radius:4px; cursor:pointer; position:relative;
    background:var(--surface2); border:1px solid var(--border); display:flex; flex-direction:column; gap:8px;
    transition:transform .12s, box-shadow .12s, border-color .12s; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  .pit:nth-child(3n) { transform:rotate(-.6deg); }
  .pit:nth-child(4n) { transform:rotate(.5deg); }
  .pit:hover { transform:translateY(-3px) rotate(0); box-shadow:0 8px 22px rgba(0,0,0,.4); border-color:var(--border2); z-index:2; }
  .pit-top { display:flex; align-items:center; gap:6px; }
  .pit-acc { width:8px; height:8px; border-radius:2px; flex-shrink:0; }
  .pit-est { margin-left:auto; font-family:'Roboto Mono',monospace; font-size:9px; color:var(--dim); border:1px solid var(--border); border-radius:3px; padding:0 4px; }
  .pit-title { font-size:13px; line-height:1.4; color:var(--text); font-weight:400; }
  .pit-foot { margin-top:auto; display:flex; align-items:center; gap:6px; }
  .pit-st { font-family:'Roboto Mono',monospace; font-size:9px; letter-spacing:.05em; padding:1px 6px; border-radius:10px; border:1px solid currentColor; }
  .pit-sp { font-family:'Roboto Mono',monospace; font-size:9px; letter-spacing:.05em; padding:1px 6px; border-radius:10px; background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
  .s-done{color:var(--green)} .s-active{color:var(--red)} .s-planned{color:var(--muted)} .s-blocked{color:var(--yellow)}

  /* blow-up overlay */
  .scrim { position:fixed; inset:0; background:rgba(10,10,10,.78); backdrop-filter:blur(3px); display:none;
    align-items:center; justify-content:center; z-index:50; padding:40px; }
  .scrim.open { display:flex; }
  .blow { width:min(760px,94vw); max-height:86vh; overflow-y:auto; background:#262626; border:1px solid var(--border2);
    border-radius:var(--radius); padding:30px 34px; box-shadow:0 30px 80px rgba(0,0,0,.6);
    animation:pop .18s ease-out; }
  @keyframes pop { from{transform:scale(.94);opacity:0} to{transform:scale(1);opacity:1} }
  .blow-top { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .blow-chip { font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.06em; padding:2px 9px; border-radius:12px; border:1px solid currentColor; }
  .blow-close { margin-left:auto; cursor:pointer; color:var(--dim); font-size:20px; line-height:1; padding:2px 6px; }
  .blow-close:hover { color:var(--text); }
  .blow h2 { font-family:'Unica One',sans-serif; font-size:30px; font-weight:400; letter-spacing:.02em; line-height:1.1; margin-bottom:6px; }
  .blow-meta { font-family:'Roboto Mono',monospace; font-size:11px; color:var(--muted); margin-bottom:16px; }
  .blow-meta b { color:var(--text); font-weight:500; }
  .blow-body { color:#d9d9d9; font-size:14px; line-height:1.75; }
  .blow .xref, .blow-body .xref { color:var(--red,#DB394C); text-decoration:none; border-bottom:1px solid rgba(219,57,76,.3); }
  .blow .xref:hover { border-bottom-color:var(--red,#DB394C); }
  .blow-sec { margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }
  .blow-sec h4 { font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-bottom:8px; }
  .dep, .lbl { display:inline-block; font-family:'Roboto Mono',monospace; font-size:11px; padding:2px 8px; margin:0 6px 6px 0;
    border:1px solid var(--border); border-radius:4px; color:var(--muted); }

  /* filmstrip nav */
  .strip { display:flex; align-items:center; gap:10px; padding:12px 22px; border-top:1px solid var(--border); flex-shrink:0; }
  .nav-btn { cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--muted); border-radius:var(--radius);
    width:34px; height:34px; font-size:16px; display:flex; align-items:center; justify-content:center; }
  .nav-btn:hover { border-color:var(--border2); color:var(--text); }
  .dots { display:flex; gap:8px; flex:1; }
  .dot { cursor:pointer; flex:1; padding:8px 12px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface);
    display:flex; flex-direction:column; gap:2px; transition:border-color .15s, background .15s; }
  .dot:hover { border-color:var(--border2); }
  .dot.active { background:var(--surface2); }
  .dot-name { font-family:'Roboto Mono',monospace; font-size:11px; color:var(--muted); letter-spacing:.04em; }
  .dot.active .dot-name { color:var(--text); }
  .dot-meta { font-family:'Roboto Mono',monospace; font-size:9px; color:var(--dim); }
  .dot-bar { height:3px; border-radius:2px; margin-top:2px; }

  .hint { font-family:'Roboto Mono',monospace; font-size:10px; color:var(--dim); }
  #loading,#err { padding:60px; text-align:center; color:var(--muted); }
  #err { color:var(--red); }
</style>
</head>
<body>
  <div class="bar">
    <span class="brand">CONFLICT <span class="sep">·</span> <b>DAS CDP</b> <span class="sep">·</span> Plan Presenter</span>
    <span class="right">
      <span class="pos" id="pos">—</span>
      <a href="/specs/">Board / Tree →</a>
      <a href="/">Command Center</a>
    </span>
  </div>

  <div class="stage" id="stage">
    <div id="loading">Loading plan…</div>
  </div>

  <div class="strip" id="strip" style="display:none">
    <div class="nav-btn" id="prev" title="Previous (←)">‹</div>
    <div class="dots" id="dots"></div>
    <div class="nav-btn" id="next" title="Next (→)">›</div>
    <span class="hint">← →&nbsp; navigate &nbsp;·&nbsp; click a card to expand &nbsp;·&nbsp; Esc closes</span>
  </div>

  <div class="scrim" id="scrim"><div class="blow" id="blow"></div></div>

<script>
// ─── Display-phase model — mirrors specs/index.html PHASE_DEFS (kept in sync). ───
const PHASE_DEFS = [
  { key:'p0', name:'Phase 0 — Discovery & Architecture', tag:'PH 0', color:'var(--p0)',
    epicIds:['phase-0-discovery','phase-1-architecture'],
    focus:'Discovery (data-source audit, identity landscape, infrastructure inventory) plus the architecture and platform-decision design. Output: the Phase 0 deliverable set.' },
  { key:'p1', name:'Phase 1 — Build (Productionized V1)', tag:'PH 1', color:'var(--p1)',
    epicIds:['phase-1-build'],
    focus:'1a — Platform: the full platform ready and tested with one source ingest per channel (~4 months). 1b — Long-tail migration: onboard all remaining sources, reimplement SSIS, migrate reporting, deprecate legacy. Workstreams are concurrent; ordering within a stream follows depends_on.' },
  { key:'p2', name:'Phase 2 — Applications', tag:'PH 2', color:'var(--p2)',
    epicIds:['phase-2-build'],
    focus:'Enhancements + applicatives on the Phase-1 CDP — can start before 1b completes once there is critical data mass. All infrastructure ships in Phase 1; Phase 2 builds what consumes it.' },
  { key:'p3', name:'Phase 3 — AI / ML', tag:'PH 3', color:'var(--p3)',
    epicIds:['phase-3-ai-ml'],
    focus:'3a — External AI integration against the CDP. 3b — Build-our-own ML (pairwise classifier, GNN/embeddings) trained on the labeled decisions Phase 1 produces. Architected for in Phase 1 (AI/ML tables ship empty-but-complete).' },
];
const STORY_OK = new Set(['story']);
let byId=new Map(), items=[], cur=0, phases=[];

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const childrenOf=id=>((byId.get(id)||{}).children||[]).map(c=>byId.get(c)).filter(Boolean);
const stClass=s=>({done:'s-done',active:'s-active',planned:'s-planned',blocked:'s-blocked'}[s]||'s-planned');
const SUBS=['1a','1b','2a','2b','3a','3b','3'];
const subOf=s=>((s.labels||[]).find(l=>SUBS.includes(l))||'');

// Repo doc paths -> clickable reader links (follow-through from a spec body).
const P_PATH=/^((?:docs|wiki|specs|memory|analysis|app|artifacts)\/[\w./-]+\.(?:md|json))(#[\w:=.\-]+)?$/;
const P_PATHG=/((?:docs|wiki|specs|memory|analysis|app|artifacts)\/[\w./-]+\.(?:md|json))(#[\w:=.\-]+)?/g;
const pLink=(p,f)=>`<a class="xref" href="/docs/reader.html?f=${p}${f||''}" target="_blank">${p}${f||''}</a>`;
// Minimal markdown for the blow-up body (bold, inline code/paths, links, lists, paragraphs).
function md(src){
  const lines=String(src||'').replace(/\r\n/g,'\n').split('\n'); let h='',inL=false;
  const inl=t=>{
    let s=esc(t).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,x,u)=>`<a class="xref" href="${esc(u)}" target="_blank">${x}</a>`);
    return s.split('`').map((seg,i)=>{
      if(i%2){const mm=seg.match(P_PATH);return mm?pLink(mm[1],mm[2]):`<code>${seg}</code>`;}
      return seg.replace(P_PATHG,(m,p,f)=>pLink(p,f));
    }).join('');
  };
  const close=()=>{if(inL){h+='</ul>';inL=false;}};
  for(const raw of lines){const line=raw.trimEnd(); if(!line.trim()){close();continue;} let m;
    if((m=line.match(/^(#{1,3})\s+(.*)$/))){close(); h+=`<p style="font-weight:500;color:#fff;margin-top:8px">${inl(m[2])}</p>`;}
    else if((m=line.match(/^\s*[-*]\s+(.*)$/))){if(!inL){h+='<ul style="margin:4px 0 4px 18px">';inL=true;} h+=`<li>${inl(m[1])}</li>`;}
    else {close(); h+=`<p style="margin:6px 0">${inl(line)}</p>`;}}
  close(); return h;
}

// Workstreams (features) + their stories for a phase's epics, in declared order.
function lanesFor(def){
  const lanes=[];
  for(const eid of def.epicIds){
    const epic=byId.get(eid); if(!epic) continue;
    for(const ws of childrenOf(eid)){
      // features hold stories; an epic may also hold stories directly (rare)
      const stories=childrenOf(ws.id).filter(s=>STORY_OK.has(s.type));
      if(ws.type==='feature'){ lanes.push({name:ws.title, stories}); }
      else if(STORY_OK.has(ws.type)){ // direct story under epic → "General" lane
        const g=lanes.find(l=>l.name==='—'); if(g) g.stories.push(ws); else lanes.push({name:'—',stories:[ws]});
      }
    }
  }
  return lanes.filter(l=>l.stories.length);
}
function rollup(stories){
  const t=stories.length, d=stories.filter(s=>s.status==='done').length; return t?`${d}/${t} done`:'';
}

function renderSlides(){
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  phases.forEach((p,i)=>{
    const lanes=lanesFor(p.def);
    const total=lanes.reduce((n,l)=>n+l.stories.length,0);
    const slide=document.createElement('div'); slide.className='slide'+(i===cur?' active':''); slide.dataset.i=i;
    const lanesHtml=lanes.map(l=>`
      <div class="lane">
        <div class="lane-h"><span class="lane-name">${esc(l.name)}</span>
          <span class="lane-roll">${esc(rollup(l.stories))}</span><span class="lane-line"></span></div>
        <div class="cards">${l.stories.map(s=>card(s,p.def)).join('')}</div>
      </div>`).join('');
    slide.innerHTML=`
      <div class="slide-head">
        <span class="slide-ph" style="color:${p.def.color}">${esc(p.def.tag)}</span>
        <span class="slide-title">${esc(p.def.name.replace(/^Phase \d+ — /,''))}</span>
        <span class="slide-count">${total} user stories · ${lanes.length} workstreams</span>
      </div>
      <div class="slide-focus">${esc(p.def.focus)}</div>
      <div class="lanes">${lanesHtml||'<p style="color:var(--dim)">No stories in this phase yet.</p>'}</div>`;
    stage.appendChild(slide);
  });
  document.querySelectorAll('.pit').forEach(el=>el.addEventListener('click',()=>openBlow(el.dataset.id)));
  syncStrip();
}
function card(s,def){
  return `<div class="pit" data-id="${esc(s.id)}">
    <div class="pit-top"><span class="pit-acc" style="background:${def.color}"></span>
      ${s.estimate?`<span class="pit-est">${esc(s.estimate)}</span>`:''}</div>
    <div class="pit-title">${esc(s.title)}</div>
    <div class="pit-foot"><span class="pit-st ${stClass(s.status)}">${esc((s.status||'planned').toUpperCase())}</span>${subOf(s)?`<span class="pit-sp">${esc(subOf(s).toUpperCase())}</span>`:''}</div>
  </div>`;
}
function openBlow(id){
  const s=byId.get(id); if(!s) return;
  const def=phases[cur].def;
  const ws=byId.get(s.parent_id);
  const deps=(s.depends_on||[]).map(d=>{const t=byId.get(d); return `<span class="dep">${esc(t?t.title:d)}</span>`;}).join('')||'<span style="color:var(--dim)">none</span>';
  const lbls=(s.labels||[]).map(l=>`<span class="lbl">${esc(l)}</span>`).join('')||'<span style="color:var(--dim)">none</span>';
  document.getElementById('blow').innerHTML=`
    <div class="blow-top">
      <span class="blow-chip" style="color:${def.color}">${esc(def.tag)}</span>
      <span class="blow-chip ${stClass(s.status)}">${esc((s.status||'planned').toUpperCase())}</span>
      ${s.estimate?`<span class="blow-chip" style="color:var(--muted)">SIZE ${esc(s.estimate)}</span>`:''}
      ${subOf(s)?`<span class="blow-chip" style="color:var(--muted)">SUB-PHASE ${esc(subOf(s).toUpperCase())}</span>`:''}
      <span class="blow-close" id="x">×</span>
    </div>
    <h2>${esc(s.title)}</h2>
    <div class="blow-meta">${esc(ws?ws.title:'')}${s.assignee?` &nbsp;·&nbsp; owner <b>${esc(s.assignee)}</b>`:''}${s.priority?` &nbsp;·&nbsp; ${esc(s.priority)} priority`:''}</div>
    <div class="blow-body" id="blowBody">${md(s.body_preview||'Loading…')}</div>
    <div class="blow-sec"><h4>Depends on</h4>${deps}</div>
    <div class="blow-sec"><h4>Labels</h4>${lbls}</div>
    ${(s.artifacts&&s.artifacts.length)?`<div class="blow-sec"><h4>Output</h4>${s.artifacts.map(a=>{const [l,hr]=String(a).split('|').map(x=>x.trim());if(!hr)return '';const u=(hr.startsWith('/')||hr.startsWith('http'))?hr:('/docs/reader.html?f='+hr);return `<a class="xref" href="${esc(u)}" target="_blank" style="display:block;margin:3px 0">↳ ${esc(l||hr)}</a>`;}).filter(Boolean).join('')}</div>`:''}`;
  document.getElementById('x').addEventListener('click',closeBlow);
  // Expose the FULL spec, not just the 200-char preview: fetch the file and render it.
  if(s.path){
    fetch('/'+s.path,{cache:'no-cache'}).then(r=>r.ok?r.text():Promise.reject()).then(txt=>{
      txt=txt.replace(/^﻿/,'').replace(/^---\s*\n[\s\S]*?\n---\s*\n?/,'');
      const b=document.getElementById('blowBody'); if(b&&txt.trim()) b.innerHTML=md(txt);
    }).catch(()=>{});
  }
  document.getElementById('scrim').classList.add('open');
}
function closeBlow(){ document.getElementById('scrim').classList.remove('open'); }

function syncStrip(){
  document.getElementById('pos').textContent=`${cur+1} / ${phases.length}`;
  const dots=document.getElementById('dots'); dots.innerHTML='';
  phases.forEach((p,i)=>{
    const lanes=lanesFor(p.def); const total=lanes.reduce((n,l)=>n+l.stories.length,0);
    const d=document.createElement('div'); d.className='dot'+(i===cur?' active':'');
    d.innerHTML=`<span class="dot-name">${esc(p.def.tag)}</span>
      <span class="dot-meta">${esc(p.def.name.replace(/^Phase \d+ — /,''))} · ${total}</span>
      <span class="dot-bar" style="background:${p.def.color}"></span>`;
    d.addEventListener('click',()=>go(i)); dots.appendChild(d);
  });
}
function go(i){ cur=Math.max(0,Math.min(phases.length-1,i));
  document.querySelectorAll('.slide').forEach(s=>s.classList.toggle('active',+s.dataset.i===cur));
  syncStrip(); }

document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeBlow(); return; }
  if(document.getElementById('scrim').classList.contains('open')) return;
  if(e.key==='ArrowRight') go(cur+1);
  if(e.key==='ArrowLeft') go(cur-1);
});
document.getElementById('scrim').addEventListener('click',e=>{ if(e.target.id==='scrim') closeBlow(); });

(async function(){
  try{
    const r=await fetch('manifest.json',{cache:'no-cache'}); if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    items=data.items||[]; byId=new Map(items.map(i=>[i.id,i]));
    phases=PHASE_DEFS.map(def=>({def})).filter(p=>p.def.epicIds.some(e=>byId.get(e)));
    document.getElementById('strip').style.display='flex';
    renderSlides();
  }catch(e){
    document.getElementById('stage').innerHTML='<div id="err">Failed to load manifest.json — '+esc(e.message)+'</div>';
  }
})();
</script>
</body>
</html>
