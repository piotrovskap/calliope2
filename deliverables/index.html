<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deliverables — DAS CDP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1D1D1D;
    --surface: rgba(255,255,255,0.05);
    --surface2: rgba(255,255,255,0.1);
    --border: rgba(168,168,167,0.2);
    --border2: rgba(236,239,245,0.1);
    --red: #DB394C;
    --red-dim: rgba(219,57,76,0.1);
    --text: #FFFFFF;
    --muted: #A8A8A7;
    --dim: rgba(255,255,255,0.3);
    --green: #4CAF50; --green-dim: rgba(76,175,80,0.1);
    --yellow: #F5A623; --yellow-dim: rgba(245,166,35,0.08);
    --blue: #4A7FA5; --blue-dim: rgba(74,127,165,0.1);
    --purple: #7A5BA8; --purple-dim: rgba(122,91,168,0.1);
    --gray: #A8A8A7; --gray-dim: rgba(168,168,167,0.1);
    --radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; font-size: 13px; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }

  /* ─── Topbar ─── */
  .topbar {
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }
  .brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .brand svg { display: block; }
  .brand-divider { color: var(--dim); margin: 0 4px; }
  .brand-name { font-family: 'Unica One', sans-serif; font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  .topnav { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .topnav a {
    font-family: 'Roboto Mono', monospace;
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--dim);
    text-decoration: none;
    transition: color .15s;
  }
  .topnav a:hover { color: var(--muted); }
  .topnav a.active { color: var(--text); }
  .phase-badge {
    font-family: 'Unica One', sans-serif;
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--red);
    border: 1px solid var(--red);
    border-radius: 3px;
    padding: 2px 10px;
    background: var(--red-dim);
    flex-shrink: 0;
  }

  /* ─── Page header ─── */
  .page-head { max-width: 1180px; margin: 0 auto; width: 100%; padding: 48px 32px 28px; }
  .head-label {
    display: inline-block;
    font-family: 'Roboto Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: .14em;
    color: var(--red);
    background: var(--red-dim);
    border: 1px solid rgba(219,57,76,.3);
    border-radius: 3px;
    padding: 3px 9px;
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Unica One', sans-serif;
    font-size: 36px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--text);
    line-height: 1;
    margin-bottom: 10px;
  }
  .head-desc { font-size: 14px; color: var(--muted); max-width: 600px; line-height: 1.7; }

  /* ─── List ─── */
  /* Two-bucket layout: engagement deliverables vs artifacts */
  .gallery-section { max-width: 1180px; margin: 0 auto; width: 100%; padding: 0 32px; }
  .gsec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 40px 0 0; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .gsec-title { font-family: 'Unica One', sans-serif; font-size: 17px; letter-spacing: .1em; text-transform: uppercase; color: var(--text); }
  .gsec-sub { font-size: 12px; color: var(--muted); }
  .list { display: flex; flex-direction: column; gap: 8px; padding-top: 18px; }
  .gallery-section:last-of-type { margin-bottom: 56px; }

  .deliv-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 18px;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s, background .15s;
  }
  .deliv-row:hover { border-color: var(--border2); background: var(--surface2); }

  .badge {
    font-family: 'Roboto Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: .08em;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid;
    white-space: nowrap;
  }
  /* Type badges */
  .t-deck     { color: var(--blue);   border-color: rgba(74,127,165,.4); background: var(--blue-dim); }
  .t-proposal { color: var(--purple); border-color: rgba(122,91,168,.4); background: var(--purple-dim); }
  .t-spec     { color: var(--yellow); border-color: rgba(245,166,35,.4); background: var(--yellow-dim); }
  .t-notes    { color: var(--muted);  border-color: var(--border2);      background: var(--surface2); }
  /* Status badges */
  .st { display: inline-flex; align-items: center; gap: 5px; }
  .st::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .st-published { color: var(--green);  border-color: rgba(76,175,80,.4);  background: var(--green-dim); }
  .st-final     { color: var(--blue);   border-color: rgba(74,127,165,.4); background: var(--blue-dim); }
  .st-draft     { color: var(--yellow); border-color: rgba(245,166,35,.4); background: var(--yellow-dim); }
  .st-archived  { color: var(--gray);   border-color: var(--border);       background: var(--gray-dim); }
  .st-planned   { color: var(--yellow); border-color: rgba(245,166,35,.4);  background: var(--yellow-dim); }
  .t-deliverable{ color: var(--red);    border-color: rgba(219,57,76,.4);   background: var(--red-dim); }

  /* Status chip pinned left; reserves a column so titles align */
  .row-status { flex-shrink: 0; width: 96px; }
  .row-status .badge { display: inline-flex; }

  /* Title + meta block */
  .row-main { flex-shrink: 0; min-width: 200px; max-width: 340px; }
  .deliv-title {
    font-family: 'Unica One', sans-serif;
    font-size: 18px;
    letter-spacing: .02em;
    color: var(--text);
    line-height: 1.2;
  }
  .row-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 3px;
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    letter-spacing: .04em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .row-meta .sep { color: var(--border); }

  /* One-line description, truncated with ellipsis, takes remaining space */
  .deliv-desc {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Open affordance pushed to the right */
  .deliv-open {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }
  .deliv-row:hover .deliv-open { color: var(--red); }
  .deliv-open .arrow { transition: transform .15s; }
  .deliv-row:hover .deliv-open .arrow { transform: translateX(3px); }

  /* ─── Footer ─── */
  footer { margin-top: auto; border-top: 1px solid var(--border); padding: 16px 32px; font-size: 11px; color: var(--dim); font-family: 'Roboto Mono', monospace; }

  @media (max-width: 720px) {
    .topbar { height: auto; flex-wrap: wrap; padding: 12px 20px; }
    h1 { font-size: 30px; }
    /* Rows condense: status + title on the first line, desc wraps below full-width */
    .deliv-row { flex-wrap: wrap; gap: 10px 12px; }
    .row-status { width: auto; }
    .row-main { max-width: none; min-width: 0; flex: 1 1 auto; }
    .deliv-desc { flex-basis: 100%; white-space: normal; }
  }
</style>
</head>

<div class="page-head">
  <span class="head-label">Deliverables</span>
  <h1>Deliverables</h1>
  <p class="head-desc">What the Phase 0 engagement is contracted to deliver — and the artifacts produced along the way.</p>

<div id="sections"></div>

<footer>DAS CDP · CONFLICT · Phase 0</footer>

<script>
// Deliverables come from two JSON sources, grouped into sections and rendered
// as a list of rows. `open` is the href each row navigates to.

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

// One deliverable = one horizontal row. Status chip pinned left, then the
// title with muted type/date meta, then a one-line truncated description
// (desc for artifacts, summary for Phase 0 deliverables — both arrive as
// d.desc), then an "open" arrow pushed to the right. The whole row links to
// d.open. No markdown preview fetch — the row uses the inline desc text.
function rowHTML(d) {
  var meta = [];
  if (d.type) meta.push('<span class="row-mtype">' + esc(d.type) + '</span>');
  if (d.date) meta.push('<span class="row-mdate">' + esc(d.date) + '</span>');
  return '<a class="deliv-row" href="' + esc(d.open) + '">' +
    '<span class="row-status"><span class="badge st ' + d.statusClass + '">' + esc(d.status) + '</span></span>' +
    '<span class="row-main">' +
      '<span class="deliv-title">' + esc(d.title) + '</span>' +
      (meta.length ? '<span class="row-meta">' + meta.join('<span class="sep">·</span>') + '</span>' : '') +
    '</span>' +
    '<span class="deliv-desc">' + esc(d.desc) + '</span>' +
    '<span class="deliv-open">Open <span class="arrow">→</span></span>' +
  '</a>';
}

// Render labeled sections as lists of rows. groups = [{title, subtitle, cards}].
function renderSections(groups) {
  var container = document.getElementById('sections');
  var html = groups.filter(function (g) { return g.cards && g.cards.length; }).map(function (g) {
    var rows = g.cards.map(rowHTML).join('');
    return '<section class="gallery-section">' +
      '<div class="gsec-head"><span class="gsec-title">' + esc(g.title) + '</span>' +
      (g.subtitle ? '<span class="gsec-sub">' + esc(g.subtitle) + '</span>' : '') +
      '</div><div class="list">' + rows + '</div></section>';
  }).join('');
  container.innerHTML = html ||
    '<div class="deliv-desc" style="color:var(--dim);padding:32px">Deliverables unavailable.</div>';
}

// Scaffolded Phase 0 deliverables live in ../docs/phase0-deliverables.json (single
// source of truth, also drives docs/deliverable.html). Map them into gallery cards
// that link to their landing pages; the shipped artifacts come from deliverables.json.
var P0_STATUS = {
  'pending':     ['Planned',     'st-planned'],
  'in-progress': ['In Progress', 'st-draft'],
  'done':        ['Delivered',   'st-published']
};
function phase0Cards(p0) {
  return (p0.deliverables || []).map(function (d) {
    var s = P0_STATUS[d.status] || P0_STATUS.pending;
    return {
      open: '../docs/deliverable.html?id=' + encodeURIComponent(d.id),
      type: 'Deliverable', typeClass: 't-deliverable',
      status: s[0], statusClass: s[1],
      title: d.title, desc: d.summary,
      date: 'End of Phase 0', preview: null
    };
  });
}

(function () {
  Promise.all([
    fetch('../docs/phase0-deliverables.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : { deliverables: [] }; })
      .catch(function () { return { deliverables: [] }; }),
    fetch('../docs/deliverables.json', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : { items: [] }; })
      .catch(function () { return { items: [] }; })
  ]).then(function (res) {
    var deliverables = phase0Cards(res[0]);                 // contractual outputs
    var artifacts = res[1].items || res[1] || [];            // working outputs
    if (!deliverables.length && !artifacts.length) throw new Error('none');
    renderSections([
      { title: 'Engagement Deliverables', subtitle: 'What Phase 0 is contracted to deliver', cards: deliverables },
      { title: 'Artifacts', subtitle: 'Working outputs produced during the engagement', cards: artifacts }
    ]);
  }).catch(function () {
    document.getElementById('sections').innerHTML =
      '<div class="deliv-desc" style="color:var(--dim);padding:32px">Deliverables unavailable.</div>';
  });
})();
</script>
