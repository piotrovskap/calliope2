<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Brain — DAS CDP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1D1D1D; --surface:#111; --surface2:#1a1a1a; --border:#2a2a2a; --border2:#333;
    --red:#DB394C; --red-dim:rgba(219,57,76,0.1);
    --text:#F8F8F8; --muted:#888; --dim:#555; --green:#4CAF50; --yellow:#F5A623;
    --blue:#4A7FA5; --purple:#7A5BA8; --radius:6px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Roboto',sans-serif; font-size:13px; line-height:1.6; min-height:100vh; }

  .header { border-bottom:1px solid var(--border); padding:0 28px; height:54px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--bg); z-index:100; }
  .brand { display:flex; align-items:center; gap:14px; }
  .wordmark { font-family:'Unica One',sans-serif; font-size:16px; color:var(--red); letter-spacing:.1em; text-transform:uppercase; line-height:1; }
  .wordmark-sub { font-size:10px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:2px; }
  .header-right { display:flex; align-items:center; gap:10px; }
  .back-link { font-size:11px; color:var(--muted); text-decoration:none; border:1px solid var(--border); border-radius:4px; padding:4px 10px; }
  .back-link:hover { color:var(--text); border-color:var(--border2); }
  .artifact-badge { font-family:'Unica One',sans-serif; font-size:11px; letter-spacing:.1em; color:var(--red); border:1px solid var(--red); border-radius:3px; padding:2px 8px; background:var(--red-dim); }

  .page { max-width:1100px; margin:0 auto; padding:28px 28px 80px; }
  .artifact-header { margin-bottom:20px; padding-bottom:18px; border-bottom:1px solid var(--border); }
  .artifact-title { font-family:'Unica One',sans-serif; font-size:28px; letter-spacing:.03em; color:var(--text); line-height:1.1; margin-bottom:8px; }
  .meta-item { font-family:'Roboto Mono',monospace; font-size:11px; color:var(--dim); }
  .lede { font-size:12px; color:var(--muted); margin-top:8px; max-width:680px; line-height:1.5; }

  #search { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-family:'Roboto',sans-serif; font-size:13px; padding:10px 14px; margin:18px 0 14px; }
  #search:focus { outline:none; border-color:var(--border2); }
  .chips { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px; }
  .chip { font-family:'Roboto Mono',monospace; font-size:10.5px; letter-spacing:.04em; color:var(--muted); border:1px solid var(--border); border-radius:4px; padding:3px 9px; cursor:pointer; user-select:none; }
  .chip:hover { color:var(--text); border-color:var(--border2); }
  .chip.active { color:var(--text); border-color:var(--border2); background:var(--surface2); }

  .result-count { font-family:'Roboto Mono',monospace; font-size:10.5px; color:var(--dim); margin-bottom:10px; }
  .node { border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); margin-bottom:6px; overflow:hidden; }
  .node-head { display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer; }
  .node-head:hover { background:var(--surface2); }
  .kbadge { font-family:'Roboto Mono',monospace; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--blue); border:1px solid var(--border2); border-radius:3px; padding:1px 6px; white-space:nowrap; }
  .node-label { font-weight:500; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node-status { font-family:'Roboto Mono',monospace; font-size:9px; text-transform:uppercase; color:var(--yellow); }
  .node-id { font-family:'Roboto Mono',monospace; font-size:10px; color:var(--dim); white-space:nowrap; }
  .node-detail { display:none; padding:4px 14px 14px; border-top:1px solid var(--border); }
  .node.open .node-detail { display:block; }
  .kv { font-size:12px; color:var(--muted); margin-top:8px; line-height:1.5; word-break:break-word; }
  .kv b { font-family:'Roboto Mono',monospace; font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; margin-right:8px; }
  .kv a.file-link { color:var(--blue); text-decoration:none; border-bottom:1px solid rgba(74,127,165,.35); word-break:break-all; }
  .kv a.file-link:hover { color:var(--text); border-bottom-color:var(--text); }
  .edges-title { font-family:'Roboto Mono',monospace; font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; margin:14px 0 6px; }
  .edge-row { display:flex; align-items:center; gap:8px; font-size:12px; padding:2px 0; }
  .edge-type { font-family:'Roboto Mono',monospace; font-size:10.5px; color:var(--muted); white-space:nowrap; }
  .edge-target { color:var(--blue); cursor:pointer; }
  .edge-target:hover { text-decoration:underline; }
  .edge-kind { font-family:'Roboto Mono',monospace; font-size:9px; color:var(--dim); }
  .edge-empty { font-size:11px; color:var(--dim); margin-top:6px; }
  .empty { color:var(--dim); padding:24px 0; text-align:center; }
</style>
</head>
<body>
<div class="header">
  <div class="brand">
    <div>
      <div class="wordmark">DAS CDP</div>
      <div class="wordmark-sub">Knowledge Brain</div>
    </div>
  </div>
  <div class="header-right">
    <span class="artifact-badge">BRAIN</span>
    <a class="back-link" href="/">← Portal</a>
  </div>
</div>

<div class="page">
  <div class="artifact-header">
    <div class="artifact-title">Knowledge Brain</div>
    <div class="meta-item" id="meta"></div>
    <div class="lede">The compiled graph over every structured source (see <code>docs/knowledge-engine.md</code>). Generated and read-only — search and browse every node kind and follow the relationships between them.</div>
  </div>

  <input id="search" placeholder="Search nodes by label, id, or kind…" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div id="nodelist"><div class="empty">Loading brain.json…</div></div>
</div>

<script>
(async () => {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const listEl = document.getElementById('nodelist');
  let brain;
  try { brain = await (await fetch('./brain.json', {cache:'no-cache'})).json(); }
  catch (e) { listEl.innerHTML = '<div class="empty">Failed to load brain.json</div>'; return; }

  const nodes = brain.nodes, edges = brain.edges;
  const byId = {}; nodes.forEach(n => byId[n.id] = n);
  const out = {}, inc = {};
  edges.forEach(e => { (out[e.src] = out[e.src] || []).push(e); (inc[e.dst] = inc[e.dst] || []).push(e); });
  const kinds = {}; nodes.forEach(n => kinds[n.kind] = (kinds[n.kind] || 0) + 1);

  document.getElementById('meta').textContent =
    `${nodes.length} nodes · ${edges.length} edges · ${Object.keys(kinds).length} kinds · v${brain.meta.version} · ${brain.meta.generated_at}`;

  let activeKind = null, q = '';
  const chipsEl = document.getElementById('chips');

  function renderChips() {
    chipsEl.innerHTML =
      `<span class="chip${activeKind === null ? ' active' : ''}" data-k="">All ${nodes.length}</span>` +
      Object.keys(kinds).sort().map(k =>
        `<span class="chip${activeKind === k ? ' active' : ''}" data-k="${esc(k)}">${esc(k)} ${kinds[k]}</span>`).join('');
    chipsEl.querySelectorAll('.chip').forEach(c => c.onclick = () => { activeKind = c.dataset.k || null; render(); });
  }

  // .md opens in the portal reader; anything else (.html/.json/.sql/dir) opens directly
  function fileHref(p) {
    return p.endsWith('.md') ? '/docs/reader.html?f=' + encodeURIComponent(p) : '/' + p;
  }

  function dataHTML(n) {
    let s = '';
    if (n.source && n.source.path) {
      const p = n.source.path;
      s = `<div class="kv"><b>source</b><a class="file-link" href="${esc(fileHref(p))}" target="_blank" rel="noopener">${esc(p)}</a></div>`;
    }
    const d = n.data || {};
    Object.keys(d).forEach(k => {
      const v = d[k];
      if (v == null || v === '' || (Array.isArray(v) && !v.length)) return;
      const str = typeof v === 'object' ? JSON.stringify(v) : String(v);
      s += `<div class="kv"><b>${esc(k)}</b>${esc(str.slice(0, 500))}</div>`;
    });
    return s;
  }

  function neighborsHTML(n) {
    const o = out[n.id] || [], i = inc[n.id] || [];
    if (!o.length && !i.length) return '<div class="edge-empty">no relationships</div>';
    const row = (e, dir) => {
      const other = dir === 'out' ? e.dst : e.src, on = byId[other];
      return `<div class="edge-row"><span class="edge-type">${dir === 'out' ? '→' : '←'} ${esc(e.type)}</span>` +
        `<span class="edge-target" data-id="${esc(other)}">${esc(on ? on.label : other)}</span>` +
        `<span class="edge-kind">${on ? esc(on.kind) : ''}</span></div>`;
    };
    return o.map(e => row(e, 'out')).join('') + i.map(e => row(e, 'in')).join('');
  }

  function nodeHTML(n) {
    return `<div class="node" data-id="${esc(n.id)}">
      <div class="node-head">
        <span class="kbadge">${esc(n.kind)}</span>
        <span class="node-label">${esc(n.label || n.id)}</span>
        ${n.status ? `<span class="node-status">${esc(n.status)}</span>` : ''}
        <span class="node-id">${esc(n.id)}</span>
      </div>
      <div class="node-detail">${dataHTML(n)}<div class="edges-title">Relationships</div>${neighborsHTML(n)}</div>
    </div>`;
  }

  const CAP = 400;
  function render() {
    let ns = nodes;
    if (activeKind) ns = ns.filter(n => n.kind === activeKind);
    if (q) { const ql = q.toLowerCase(); ns = ns.filter(n => (n.label || '').toLowerCase().includes(ql) || n.id.toLowerCase().includes(ql) || n.kind.toLowerCase().includes(ql)); }
    renderChips();
    const shown = ns.slice(0, CAP);
    listEl.innerHTML = `<div class="result-count">${ns.length} node${ns.length === 1 ? '' : 's'}${ns.length > CAP ? ` (showing ${CAP})` : ''}</div>` +
      (shown.length ? shown.map(nodeHTML).join('') : '<div class="empty">No matching nodes</div>');
    listEl.querySelectorAll('.node-head').forEach(h => h.onclick = () => h.parentElement.classList.toggle('open'));
    listEl.querySelectorAll('.edge-target').forEach(t => t.onclick = ev => {
      ev.stopPropagation();
      const id = t.dataset.id;
      q = ''; activeKind = null; document.getElementById('search').value = '';
      render();
      const el = listEl.querySelector('.node[data-id="' + CSS.escape(id) + '"]');
      if (el) { el.classList.add('open'); el.scrollIntoView({behavior:'smooth', block:'center'}); }
    });
  }

  document.getElementById('search').addEventListener('input', e => { q = e.target.value.trim(); render(); });
  render();
})();
</script>
</body>
</html>
