<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAS CDP — Knowledge Graph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --bg:        #000000;
      --surface:   rgba(30, 30, 30, 0.85);
      --border:    #444443;
      --red:       #DB394C;
      --red-light: #E26170;
      --text:      #F8F8F8;
      --muted:     #D6D6D6;
      --dim:       #888;

      --concept:      #4A7FA5;
      --technology:   #DB394C;
      --person:       #5BA85A;
      --organization: #A87C3E;
      --time:         #7A5BA8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Roboto', -apple-system, sans-serif;
      height: 100vh;
      display: grid;
      grid-template-rows: 56px 1fr;
      grid-template-columns: 320px 1fr;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .wordmark {
      font-family: 'Unica One', sans-serif;
      font-size: 1.1rem;
      color: var(--red);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .wordmark span {
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.02em;
    }

    .sep { color: var(--border); margin: 0 0.25rem; }

    #search {
      margin-left: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: 'Roboto Mono', monospace;
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      width: 260px;
      outline: none;
    }
    #search:focus { border-color: var(--red); }
    #search::placeholder { color: var(--dim); }

    .stats {
      font-size: 0.75rem;
      color: var(--dim);
      white-space: nowrap;
    }

    /* ── Sidebar ── */
    aside {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: var(--bg);
    }

    aside h2 {
      font-family: 'Unica One', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--dim);
      margin-bottom: 0.5rem;
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0.2rem 0.3rem;
      border-radius: 3px;
      transition: background 0.15s;
    }
    .legend-item:hover { background: var(--surface); }
    .legend-item.dimmed { opacity: 0.35; }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-count {
      margin-left: auto;
      color: var(--dim);
      font-size: 0.72rem;
      font-family: 'Roboto Mono', monospace;
    }

    /* detail panel */
    #detail {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.9rem;
      font-size: 0.8rem;
      min-height: 120px;
      flex-shrink: 0;
    }

    #detail h3 {
      font-family: 'Unica One', sans-serif;
      font-size: 1rem;
      color: var(--red);
      margin-bottom: 0.4rem;
      word-break: break-word;
    }

    #detail .type-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-family: 'Roboto Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.15rem 0.4rem;
      border-radius: 2px;
      margin-bottom: 0.5rem;
      border: 1px solid currentColor;
    }

    #detail .desc {
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 0.5rem;
    }

    #detail .connections {
      color: var(--dim);
      font-size: 0.72rem;
      font-family: 'Roboto Mono', monospace;
    }

    #detail .neighbor-list {
      margin-top: 0.4rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    #detail .neighbor-chip {
      background: rgba(219, 57, 76, 0.12);
      border: 1px solid rgba(219, 57, 76, 0.3);
      border-radius: 3px;
      padding: 0.15rem 0.4rem;
      font-size: 0.68rem;
      cursor: pointer;
      color: var(--red-light);
      transition: background 0.15s;
    }
    #detail .neighbor-chip:hover { background: rgba(219, 57, 76, 0.25); }

    #detail .detail-refs {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #detail .refs-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--dim);
      margin-bottom: 2px;
    }
    #detail .ref-link {
      font-size: 0.78rem;
      color: var(--red);
      text-decoration: none;
      line-height: 1.35;
    }
    #detail .ref-link:hover { text-decoration: underline; }

    #detail-placeholder {
      color: var(--dim);
      font-size: 0.78rem;
      line-height: 1.6;
    }

    /* results list */
    #results {
      flex: 1;
      overflow-y: auto;
    }

    #results h2 { margin-bottom: 0.4rem; }

    .result-item {
      padding: 0.4rem 0.5rem;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.12s;
    }
    .result-item:hover, .result-item.active { background: var(--surface); }
    .result-name { flex: 1; word-break: break-word; }
    .result-type {
      font-size: 0.65rem;
      color: var(--dim);
      font-family: 'Roboto Mono', monospace;
      flex-shrink: 0;
    }

    /* ── Graph canvas ── */
    #graph {
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    svg {
      width: 100%;
      height: 100%;
    }

    .link {
      stroke: #333;
      stroke-width: 1px;
      stroke-opacity: 0.6;
    }
    .link.highlighted { stroke: var(--red); stroke-opacity: 1; stroke-width: 1.5px; }
    .link.edge-hover { stroke: var(--red-light); stroke-opacity: 1; stroke-width: 2px; }

    /* invisible wide hit-area drawn over each edge so thin lines are easy to hover */
    .link-hit { stroke: transparent; stroke-width: 10px; fill: none; cursor: pointer; }

    #edge-tip {
      position: absolute;
      pointer-events: none;
      display: none;
      background: var(--surface);
      border: 1px solid var(--red);
      border-radius: 3px;
      padding: 0.2rem 0.5rem;
      font-family: 'Roboto Mono', monospace;
      font-size: 0.7rem;
      color: var(--text);
      white-space: nowrap;
      z-index: 20;
      transform: translate(-50%, calc(-100% - 8px));
    }
    #edge-tip .tip-rel { color: var(--red-light); }

    .node circle {
      stroke: #000;
      stroke-width: 1.5px;
      cursor: pointer;
      transition: r 0.15s;
    }
    .node circle:hover { stroke: var(--text); stroke-width: 2px; }
    .node.selected circle { stroke: var(--red); stroke-width: 2.5px; }
    .node.dimmed { opacity: 0.1; }
    .node.neighbor circle { stroke: var(--red-light); stroke-width: 1.5px; }

    .node text {
      font-size: 9px;
      font-family: 'Roboto', sans-serif;
      fill: var(--muted);
      pointer-events: none;
      dominant-baseline: middle;
    }

    .controls {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .ctrl-btn {
      width: 32px; height: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s;
    }
    .ctrl-btn:hover { border-color: var(--red); }

    /* wider text-label variant (PNG / MMD export) */
    .ctrl-btn.ctrl-btn-text {
      width: 32px;
      font-family: 'Unica One', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.06em;
    }
    .ctrl-divider {
      height: 1px;
      background: var(--border);
      margin: 0.15rem 2px;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.5rem;
      color: var(--dim);
      font-size: 0.85rem;
    }

    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div class="wordmark">C[]NFLICT <span class="sep">/</span> <span>DAS CDP Knowledge Graph</span></div>
  <div class="stats" id="header-stats">—</div>
  <input id="search" type="text" placeholder="search entities…" autocomplete="off" spellcheck="false">
</header>

<aside>
  <div>
    <h2>Entity Types</h2>
    <div class="legend" id="legend"></div>
  </div>

  <div id="detail">
    <div id="detail-placeholder">Click a node to explore its connections.</div>
    <div id="detail-content" style="display:none"></div>
  </div>

  <div id="results">
    <h2>Entities</h2>
    <div id="results-list"></div>
  </div>
</aside>

<div id="graph">
  <div id="loading"><div class="spinner"></div><span>Loading knowledge graph…</span></div>
  <div id="edge-tip"></div>
  <div class="controls">
    <button class="ctrl-btn" id="zoom-in" title="Zoom in">+</button>
    <button class="ctrl-btn" id="zoom-out" title="Zoom out">−</button>
    <button class="ctrl-btn" id="zoom-fit" title="Fit to screen">⊡</button>
    <div class="ctrl-divider"></div>
    <button class="ctrl-btn ctrl-btn-text" id="export-png" title="Export visible graph as PNG">PNG</button>
    <button class="ctrl-btn ctrl-btn-text" id="export-mmd" title="Export visible graph as Mermaid (.mmd)">MMD</button>
  </div>
</div>

<script>
const TYPE_COLORS = {
  concept:      'var(--concept)',
  technology:   'var(--technology)',
  person:       'var(--person)',
  organization: 'var(--organization)',
  time:         'var(--time)',
};

const TYPE_RADIUS = {
  person: 9, organization: 8, technology: 7, concept: 5, time: 5,
};

let allNodes = [], allEdges = [];
let simulation, svg, linkSel, linkHitSel, nodeSel, zoom;
let activeTypes = new Set(Object.keys(TYPE_COLORS));
let selectedNode = null;

// ── Format-normalization adapter ─────────────────────────────────────────────
// The viewer harmonizes three knowledge-graph source formats into ONE internal
// model — node {id, name, type, ...rest}, edge {source, target, type} — where
// edge.source/edge.target are the string `id`s of the nodes they connect.
//
//   1. PLANOPTICON  (default; `app/knowledge_graph.json`)
//      { nodes:[{id, name, type, sessions}], edges:[{source, target, type, session}] }
//      Node type from `type`, name from `name`. Edges reference nodes by name/id.
//
//   2. NAVEGADOR EXPLORER  (`navegador explore` → GET /api/graph)
//      { nodes:[{id, label, name, ...props}], edges:[{source, target, type}] }
//      Node TYPE comes from `label` (not `type`); name from `name`.
//
//   3. NAVEGADOR JSONL EXPORT  (`navegador export` → .jsonl text)
//      Newline-delimited JSON objects, one per line:
//        {"kind":"node","label":<Type>,"props":{"name":...,...}}
//        {"kind":"edge","type":<REL>,"from":{<props>},"to":{<props>}}
//      Node id derived from props (id › qualified_name › name › label+sorted-props);
//      edges map from/to prop-dicts to node ids by the same key strategy.
//
// Defensive variants honored across all formats:
//   container : nodes | entities ; edges | relationships | links
//   node name : name | label | title    node type : type | label | kind | category
//   edge ends : source|from|src , target|to|dst    edge type : type|relationship|rel|label
// When a node carries `label` for BOTH id and type alongside a separate `name`,
// type=label and name=name; when only `label` is present, it serves as both.

// Stable id for a Navegador-JSONL prop-dict: prefer explicit identifiers, else a
// label+sorted-props composite so the same entity resolves identically on both
// node lines and edge from/to references.
function jsonlNodeId(props, label) {
  if (!props || typeof props !== 'object') return String(props ?? '');
  if (props.id != null) return String(props.id);
  if (props.qualified_name != null) return String(props.qualified_name);
  if (props.name != null) return String(props.name);
  const pairs = Object.keys(props).sort().map(k => `${k}=${props[k]}`).join('|');
  return `${label || 'node'}:${pairs}`;
}

// Try to parse `raw` as newline-delimited JSON objects. Returns the array of
// parsed line-objects when the body is genuinely JSONL (>=1 object, no single
// top-level JSON doc), else null.
function tryParseJsonl(raw) {
  if (typeof raw !== 'string') return null;
  const trimmed = raw.trim();
  if (!trimmed) return null;
  // A single JSON object/array is NOT JSONL — let the JSON path handle it.
  if (trimmed[0] === '{' || trimmed[0] === '[') {
    try { JSON.parse(trimmed); return null; } catch { /* not a single doc — fall through */ }
  }
  const objs = [];
  for (const line of trimmed.split(/\r?\n/)) {
    const s = line.trim();
    if (!s) continue;
    let obj;
    try { obj = JSON.parse(s); } catch { return null; }   // any non-JSON line ⇒ not JSONL
    if (obj && typeof obj === 'object') objs.push(obj);
  }
  return objs.length ? objs : null;
}

// Classify the input. `raw` may be a parsed JSON value OR raw text (JSONL).
function detectFormat(raw) {
  if (typeof raw === 'string') {
    if (tryParseJsonl(raw)) return 'navegador-jsonl';
    try { raw = JSON.parse(raw); } catch { return 'unknown'; }
  }
  if (Array.isArray(raw) && raw.length && raw[0] && raw[0].kind) return 'navegador-jsonl-parsed';
  if (!raw || typeof raw !== 'object') return 'unknown';
  const nodes = raw.nodes || raw.entities || [];
  const sample = nodes[0] || {};
  // Navegador-explorer nodes carry a `label` (the entity type) distinct from `type`.
  if (sample.label != null && sample.type == null) return 'navegador-explorer';
  return 'planopticon';
}

const firstDefined = (obj, keys, fallback) => {
  for (const k of keys) if (obj[k] != null) return obj[k];
  return fallback;
};

// Map any supported format into the internal model.
function normalizeGraph(raw) {
  // JSONL — line-objects (raw text or pre-parsed kind-tagged array).
  let jsonlObjs = null;
  if (typeof raw === 'string') jsonlObjs = tryParseJsonl(raw);
  else if (Array.isArray(raw) && raw.length && raw[0] && raw[0].kind) jsonlObjs = raw;
  if (jsonlObjs) return normalizeJsonl(jsonlObjs);

  if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch { return { nodes: [], edges: [] }; } }
  if (!raw || typeof raw !== 'object') return { nodes: [], edges: [] };

  const rawNodes = raw.nodes || raw.entities || [];
  const rawEdges = raw.edges || raw.relationships || raw.links || [];

  const nodes = rawNodes.map((n, i) => {
    const hasSeparateType = n.type != null || n.kind != null || n.category != null;
    // type: explicit type wins; else `label` (Navegador-explorer) acts as type.
    const rawType = firstDefined(n, ['type', 'kind', 'category', 'label'], 'concept');
    // name: explicit name wins; if `label` doubles as the only identifier, reuse it.
    const name = firstDefined(n, ['name', 'title'], hasSeparateType ? n.label : null)
              ?? n.label ?? n.id ?? `node-${i}`;
    const id = n.id ?? n.name ?? n.qualified_name ?? n.label ?? `node-${i}`;
    return { ...n, id: String(id), name: String(name), type: String(rawType).toLowerCase() };
  });

  const edges = rawEdges.map(e => ({
    source: String(firstDefined(e, ['source', 'from', 'src'], '')),
    target: String(firstDefined(e, ['target', 'to', 'dst'], '')),
    type:   String(firstDefined(e, ['type', 'relationship', 'rel', 'label'], '')),
  }));

  return { nodes, edges };
}

function normalizeJsonl(objs) {
  const nodes = [];
  const seen = new Set();
  const edges = [];
  for (const o of objs) {
    const kind = (o.kind || '').toLowerCase();
    if (kind === 'node') {
      const props = o.props || {};
      const id = jsonlNodeId(props, o.label);
      if (seen.has(id)) continue;
      seen.add(id);
      const name = props.name ?? props.qualified_name ?? id;
      nodes.push({ ...props, id, name: String(name), type: String(o.label || 'concept').toLowerCase() });
    } else if (kind === 'edge') {
      edges.push({
        source: jsonlNodeId(o.from || {}, (o.from || {}).label),
        target: jsonlNodeId(o.to   || {}, (o.to   || {}).label),
        type:   String(o.type || o.rel || o.relationship || ''),
      });
    }
  }
  // Synthesize any endpoint referenced by an edge but missing a node line.
  for (const e of edges) {
    for (const end of [e.source, e.target]) {
      if (end && !seen.has(end)) {
        seen.add(end);
        nodes.push({ id: end, name: end, type: 'concept' });
      }
    }
  }
  return { nodes, edges };
}

// ── Load data ──────────────────────────────────────────────────────────────
async function loadGraph() {
  // Try to load from relative path — viewer is co-located with the JSON
  const paths = [
    './knowledge_graph.json',
    '../analysis/sessions/kickoff-2026-05-27-deep/knowledge-graph-curated/knowledge_graph.json',
  ];

  let raw = null;
  for (const p of paths) {
    try {
      const r = await fetch(p);
      if (r.ok) {
        // Accept either parsed JSON or raw text (JSONL). Prefer JSON when the
        // body parses as a single document; fall back to text for JSONL.
        const body = await r.text();
        try { raw = JSON.parse(body); } catch { raw = body; }
        break;
      }
    } catch {}
  }

  if (raw == null) {
    document.getElementById('loading').innerHTML =
      '<span style="color:var(--red)">Could not load knowledge_graph.json</span>' +
      '<span style="font-size:0.72rem;color:var(--dim)">Serve this file via a local HTTP server or place knowledge_graph.json alongside index.html</span>';
    return;
  }

  // Curated concept → repo-doc reference map (hand-maintained; survives Planopticon regen).
  window.KG_REFS = {};
  try { const rr = await fetch('./kg-references.json'); if (rr.ok) window.KG_REFS = (await rr.json()).refs || {}; } catch {}

  const model = normalizeGraph(raw);
  allNodes = model.nodes;
  allEdges = model.edges;

  document.getElementById('loading').style.display = 'none';
  buildLegend();
  buildGraph();
  buildResultsList(allNodes);
  updateHeaderStats();
}

// ── Legend ─────────────────────────────────────────────────────────────────
function buildLegend() {
  const counts = {};
  allNodes.forEach(n => { counts[n.type] = (counts[n.type] || 0) + 1; });
  const legend = document.getElementById('legend');
  legend.innerHTML = '';

  Object.entries(TYPE_COLORS).forEach(([type, color]) => {
    const count = counts[type] || 0;
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.dataset.type = type;
    item.innerHTML = `
      <div class="dot" style="background:${color}"></div>
      <span>${type}</span>
      <span class="legend-count">${count}</span>`;
    item.addEventListener('click', () => toggleType(type, item));
    legend.appendChild(item);
  });
}

function toggleType(type, el) {
  if (activeTypes.has(type)) {
    activeTypes.delete(type);
    el.classList.add('dimmed');
  } else {
    activeTypes.add(type);
    el.classList.remove('dimmed');
  }
  filterGraph();
}

// ── D3 graph ───────────────────────────────────────────────────────────────
function buildGraph() {
  const container = document.getElementById('graph');
  const W = container.clientWidth, H = container.clientHeight;

  svg = d3.select('#graph').append('svg');
  const g = svg.append('g').attr('class', 'graph-root');

  zoom = d3.zoom().scaleExtent([0.05, 4]).on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);

  // Defs — arrowhead
  svg.append('defs').append('marker')
    .attr('id', 'arrow').attr('viewBox', '0 -4 8 8')
    .attr('refX', 14).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path').attr('d', 'M0,-4L8,0L0,4').attr('fill', '#444');

  linkSel = g.append('g').attr('class', 'links').selectAll('line');
  linkHitSel = g.append('g').attr('class', 'link-hits').selectAll('line');
  nodeSel = g.append('g').attr('class', 'nodes').selectAll('g');

  simulation = d3.forceSimulation()
    .force('link', d3.forceLink().id(d => d.id).distance(60).strength(0.4))
    .force('charge', d3.forceManyBody().strength(-120).distanceMax(300))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide().radius(d => (TYPE_RADIUS[d.type] || 5) + 3))
    .on('tick', ticked);

  filterGraph();

  // Zoom controls
  document.getElementById('zoom-in').onclick = () => svg.transition().call(zoom.scaleBy, 1.4);
  document.getElementById('zoom-out').onclick = () => svg.transition().call(zoom.scaleBy, 0.7);
  document.getElementById('zoom-fit').onclick = fitView;

  // Export controls
  document.getElementById('export-png').onclick = exportPNG;
  document.getElementById('export-mmd').onclick = exportMermaid;
}

// ── Export ───────────────────────────────────────────────────────────────────
const BRAND_BG = '#000000';

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Serialize the live <svg> (keeping its current zoom/pan transform and computed
// node positions) and rasterize to a brand-backed PNG sized to the viewport.
function exportPNG() {
  const container = document.getElementById('graph');
  const W = container.clientWidth, H = container.clientHeight;

  const svgNode = svg.node();
  const clone = svgNode.cloneNode(true);
  // Strip the transparent hit-area overlay — it is interaction-only.
  clone.querySelectorAll('.link-hits').forEach(el => el.remove());
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', W);
  clone.setAttribute('height', H);
  clone.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // A detached SVG has no :root CSS variables and no stylesheet, so the node
  // circles (fill="var(--type)") and the class-styled text/links would lose all
  // color and font. Resolve the live palette to concrete values and inline them.
  const rootStyle = getComputedStyle(document.documentElement);
  const palette = {};
  ['concept','technology','person','organization','time'].forEach(t => {
    palette[t] = (rootStyle.getPropertyValue('--' + t).trim()) || '#555';
  });
  clone.querySelectorAll('.node circle').forEach(c => {
    const f = c.getAttribute('fill') || '';
    const m = f.match(/var\(--([a-z]+)\)/);
    c.setAttribute('fill', m ? (palette[m[1]] || '#555') : f);
    c.setAttribute('stroke', '#000');
  });
  clone.querySelectorAll('.node text').forEach(t => {
    t.setAttribute('fill', '#D6D6D6');
    t.setAttribute('font-family', "'Roboto', sans-serif");
    t.setAttribute('font-size', '9px');
  });
  clone.querySelectorAll('.links line').forEach(l => {
    l.setAttribute('stroke', '#333');
    l.setAttribute('stroke-opacity', l.getAttribute('stroke-opacity') || '0.6');
  });

  const svgStr = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);

  const scale = Math.min(2, window.devicePixelRatio || 1);
  const canvas = document.createElement('canvas');
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = BRAND_BG;
  ctx.fillRect(0, 0, W, H);

  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob => { if (blob) triggerDownload(blob, 'das-cdp-knowledge-graph.png'); }, 'image/png');
  };
  img.onerror = () => { URL.revokeObjectURL(url); };
  img.src = url;
}

// Emit a Mermaid `flowchart LR` of the CURRENTLY VISIBLE nodes/edges.
function exportMermaid() {
  const visNodes = (nodeSel ? nodeSel.data() : []);
  const visEdges = (linkSel ? linkSel.data() : []);

  const idMap = new Map();
  let counter = 0;
  const mmdId = node => {
    if (idMap.has(node.id)) return idMap.get(node.id);
    let base = String(node.id).replace(/[^A-Za-z0-9_]/g, '_').replace(/^_+|_+$/g, '');
    if (!base || /^[0-9]/.test(base)) base = 'n_' + base;
    let id = base;
    while ([...idMap.values()].includes(id)) id = `${base}_${++counter}`;
    idMap.set(node.id, id);
    return id;
  };
  const esc = s => String(s).replace(/"/g, '#quot;');

  const lines = ['flowchart LR'];
  visNodes.forEach(n => { lines.push(`  ${mmdId(n)}["${esc(n.name || n.id)}"]`); });

  const visIds = new Set(visNodes.map(n => n.id));
  visEdges.forEach(e => {
    const s = e.source?.id ?? e.source;
    const t = e.target?.id ?? e.target;
    if (!visIds.has(s) || !visIds.has(t)) return;
    const sid = idMap.get(s), tid = idMap.get(t);
    if (!sid || !tid) return;
    const rel = e.type ? `|${esc(e.type)}|` : '';
    lines.push(`  ${sid} -->${rel} ${tid}`);
  });

  const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/plain;charset=utf-8' });
  triggerDownload(blob, 'das-cdp-knowledge-graph.mmd');
}

function filterGraph() {
  const visNodes = allNodes.filter(n => activeTypes.has(n.type));
  const visIds = new Set(visNodes.map(n => n.id));
  const visEdges = allEdges.filter(e => visIds.has(e.source?.id || e.source) && visIds.has(e.target?.id || e.target));

  // Rebind data
  const linkKey = d => `${d.source?.id||d.source}-${d.target?.id||d.target}-${d.type}`;
  linkSel = d3.select('.links').selectAll('line').data(visEdges, linkKey);
  linkSel.exit().remove();
  linkSel = linkSel.enter().append('line').attr('class', 'link')
    .attr('marker-end', 'url(#arrow)')
    .merge(linkSel);

  // Transparent wide overlay lines carry the edge-hover interaction.
  linkHitSel = d3.select('.link-hits').selectAll('line').data(visEdges, linkKey);
  linkHitSel.exit().remove();
  linkHitSel = linkHitSel.enter().append('line').attr('class', 'link-hit')
    .on('mouseover', edgeMouseOver)
    .on('mousemove', edgeMouseMove)
    .on('mouseout', edgeMouseOut)
    .merge(linkHitSel);

  nodeSel = d3.select('.nodes').selectAll('g').data(visNodes, d => d.id);
  nodeSel.exit().remove();

  const nodeEnter = nodeSel.enter().append('g')
    .attr('class', 'node')
    .call(d3.drag()
      .on('start', dragStart)
      .on('drag', dragged)
      .on('end', dragEnd))
    .on('click', (e, d) => { e.stopPropagation(); selectNode(d); });

  nodeEnter.append('circle')
    .attr('r', d => TYPE_RADIUS[d.type] || 5)
    .attr('fill', d => TYPE_COLORS[d.type] || '#555');

  nodeEnter.append('text')
    .attr('x', d => (TYPE_RADIUS[d.type] || 5) + 3)
    .attr('y', 0)
    .text(d => { const t = d.name || d.id; return t.length > 22 ? t.slice(0, 20) + '…' : t; });

  nodeSel = nodeEnter.merge(nodeSel);

  svg.on('click', () => clearSelection());

  simulation.nodes(visNodes);
  simulation.force('link').links(visEdges);
  simulation.alpha(0.5).restart();
}

function ticked() {
  linkSel
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  linkHitSel
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
}

// ── Edge hover — surface relationship type ───────────────────────────────────
function edgeMouseOver(e, d) {
  linkSel.classed('edge-hover', l => l === d);
  const tip = document.getElementById('edge-tip');
  const s = d.source?.name || d.source?.id || d.source;
  const t = d.target?.name || d.target?.id || d.target;
  const rel = d.type || 'related';
  tip.innerHTML = `${s} <span class="tip-rel">${rel}</span> ${t}`;
  tip.style.display = 'block';
  positionEdgeTip(e);
}
function edgeMouseMove(e) { positionEdgeTip(e); }
function edgeMouseOut() {
  linkSel.classed('edge-hover', false);
  document.getElementById('edge-tip').style.display = 'none';
}
function positionEdgeTip(e) {
  const rect = document.getElementById('graph').getBoundingClientRect();
  const tip = document.getElementById('edge-tip');
  tip.style.left = (e.clientX - rect.left) + 'px';
  tip.style.top  = (e.clientY - rect.top) + 'px';
}

function dragStart(e, d) {
  if (!e.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnd(e, d) {
  if (!e.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// ── Selection ──────────────────────────────────────────────────────────────
function selectNode(d) {
  selectedNode = d;

  const nameOf = id => { const n = allNodes.find(x => x.id === id); return (n && n.name) || id; };
  const edgeMap = allEdges.reduce((acc, e) => {
    const s = e.source?.id || e.source;
    const t = e.target?.id || e.target;
    if (s === d.id) { acc[t] = acc[t] || []; acc[t].push({ dir: '→', type: e.type, id: t, name: nameOf(t) }); }
    if (t === d.id) { acc[s] = acc[s] || []; acc[s].push({ dir: '←', type: e.type, id: s, name: nameOf(s) }); }
    return acc;
  }, {});

  const neighborIds = new Set(Object.keys(edgeMap));

  nodeSel
    .classed('selected', n => n.id === d.id)
    .classed('neighbor', n => neighborIds.has(n.id))
    .classed('dimmed', n => n.id !== d.id && !neighborIds.has(n.id));

  linkSel
    .classed('highlighted', e => (e.source?.id||e.source) === d.id || (e.target?.id||e.target) === d.id)
    .attr('stroke-opacity', e => ((e.source?.id||e.source) === d.id || (e.target?.id||e.target) === d.id) ? 1 : 0.08);

  showDetail(d, edgeMap);
}

function clearSelection() {
  selectedNode = null;
  nodeSel.classed('selected dimmed neighbor', false);
  linkSel.classed('highlighted', false).attr('stroke-opacity', 0.6);
  document.getElementById('detail-placeholder').style.display = '';
  document.getElementById('detail-content').style.display = 'none';
}

function showDetail(d, edgeMap) {
  const color = TYPE_COLORS[d.type] || '#555';
  const desc = (d.descriptions || [])[0] || '';
  const neighbors = Object.values(edgeMap).flat();

  document.getElementById('detail-placeholder').style.display = 'none';
  const content = document.getElementById('detail-content');
  content.style.display = '';
  content.innerHTML = `
    <h3>${d.name || d.id}</h3>
    <span class="type-badge" style="color:${color}">${d.type}</span>
    ${desc ? `<div class="desc">${desc}</div>` : ''}
    <div class="connections">${neighbors.length} connection${neighbors.length !== 1 ? 's' : ''}</div>
    ${neighbors.length ? `
      <div class="neighbor-list">
        ${neighbors.slice(0, 12).map(n => `
          <span class="neighbor-chip" data-id="${n.id}">${n.dir} ${n.name}</span>
        `).join('')}
        ${neighbors.length > 12 ? `<span style="color:var(--dim);font-size:0.68rem">+${neighbors.length - 12} more</span>` : ''}
      </div>` : ''}
    ${(window.KG_REFS && window.KG_REFS[d.id] && window.KG_REFS[d.id].length) ? `
      <div class="detail-refs">
        <div class="refs-label">References</div>
        ${window.KG_REFS[d.id].map(r => `<a class="ref-link" href="${r.href}" target="_blank" rel="noopener">${r.title} ↗</a>`).join('')}
      </div>` : ''}
  `;

  content.querySelectorAll('.neighbor-chip').forEach(chip => {
    chip.addEventListener('click', e => {
      e.stopPropagation();
      const target = allNodes.find(n => n.id === chip.dataset.id);
      if (target) { selectNode(target); centerOn(target); }
    });
  });
}

function centerOn(d) {
  const container = document.getElementById('graph');
  const W = container.clientWidth, H = container.clientHeight;
  svg.transition().duration(500).call(
    zoom.transform,
    d3.zoomIdentity.translate(W / 2 - d.x, H / 2 - d.y)
  );
}

function fitView() {
  const container = document.getElementById('graph');
  const W = container.clientWidth, H = container.clientHeight;
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(0.4));
}

// ── Search + results list ──────────────────────────────────────────────────
function buildResultsList(nodes) {
  const list = document.getElementById('results-list');
  list.innerHTML = '';
  nodes.slice(0, 80).forEach(n => {
    const item = document.createElement('div');
    item.className = 'result-item';
    item.innerHTML = `
      <div class="dot" style="background:${TYPE_COLORS[n.type]||'#555'}"></div>
      <span class="result-name">${n.name || n.id}</span>
      <span class="result-type">${n.type}</span>`;
    item.addEventListener('click', () => {
      if (!activeTypes.has(n.type)) return;
      selectNode(n);
      centerOn(n);
    });
    list.appendChild(item);
  });
  if (nodes.length > 80) {
    const more = document.createElement('div');
    more.style.cssText = 'color:var(--dim);font-size:0.72rem;padding:0.3rem 0.5rem;';
    more.textContent = `+${nodes.length - 80} more — refine your search`;
    list.appendChild(more);
  }
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { buildResultsList(allNodes); return; }
  const filtered = allNodes.filter(n => (n.name || n.id).toLowerCase().includes(q) ||
    n.id.toLowerCase().includes(q) ||
    (n.descriptions || []).some(d => d.toLowerCase().includes(q)));
  buildResultsList(filtered);
});

function updateHeaderStats() {
  document.getElementById('header-stats').textContent =
    `${allNodes.length} entities · ${allEdges.length} relationships`;
}

loadGraph();
</script>
