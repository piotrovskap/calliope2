name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # .gitmodules pins wiki with update=none, so `submodules: recursive` skips
      # it — but the portal generators index wiki/ pages, so CI must populate it
      # or the generated-output freshness check diverges from local. The submodule
      # clone needs its own credentials (checkout only persists them for the main repo).
      - name: Check out wiki submodule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git -c submodule.wiki.update=checkout submodule update --init --force wiki

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # _gen.py parses spec frontmatter with PyYAML when available and falls back
      # to a minimal manual parser otherwise. Generated outputs are committed from
      # a PyYAML environment, so CI must match (Python version + PyYAML) or the
      # generated-clean freshness check diverges.
      - name: Install Python deps
        run: python -m pip install --quiet -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Node deps
        run: npm ci

      # The commit-hygiene gates (no co-author trailers, @weareconflict.com author)
      # scan a range. Locally that's unpushed commits; in CI it's this PR/push's
      # commits only — never already-published history.
      - name: Compute commit-hygiene range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "range=${{ github.sha }} --not --remotes" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # Generates portal data, validates JSON/schemas/links, runs Worker tests,
      # and fails if any generated output (manifests, knowledge-pack, DB catalog,
      # generated README table) is stale relative to its source.
      - name: Portal + content verification
        run: make portal-verify

      # Co-author attribution, author identity, submodule reachability, and the
      # cross-file content-consistency validators. The attribution/identity gates
      # validate the PR's own commits; we skip them on push (the merge/squash
      # commit is GitHub-authored and was already validated as a PR).
      - name: Convention checks
        if: github.event_name == 'pull_request'
        run: make ci-checks HYGIENE_RANGE="${{ steps.range.outputs.range }}"

      # On push to main, still verify content/generated freshness (no hygiene range needed).
      - name: Convention checks (push)
        if: github.event_name == 'push'
        run: make check-submodule-resolvable
