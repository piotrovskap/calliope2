<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architecture Diagrams — DAS CDP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1D1D1D; --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.08);
    --border:rgba(168,168,167,.2); --border2:rgba(236,239,245,.15);
    --red:#DB394C; --red-dim:rgba(219,57,76,.1);
    --text:#FFFFFF; --muted:#A8A8A7; --dim:rgba(255,255,255,.3); --radius:6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; font-size: 13px; line-height: 1.6; min-height: 100vh; }
  .topbar { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 200; }
  .brand { display: flex; align-items: center; gap: 4px; }
  .brand-div { color: var(--dim); margin: 0 8px; }
  .brand-sub { font-family: 'Unica One', sans-serif; font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  .back { font-family: 'Roboto Mono', monospace; font-size: 11px; color: var(--muted); text-decoration: none; border: 1px solid var(--border); border-radius: 4px; padding: 5px 13px; }
  .back:hover { color: var(--red); border-color: var(--red); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 32px 64px; }
  .crumb { font-family: 'Roboto Mono', monospace; font-size: 11px; color: var(--dim); margin-bottom: 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .crumb a { color: var(--muted); text-decoration: none; } .crumb a:hover { color: var(--red); } .crumb .sep { color: var(--border2); }
  .d-label { font-family: 'Roboto Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--red); background: var(--red-dim); border: 1px solid rgba(219,57,76,.3); border-radius: 3px; padding: 2px 8px; display: inline-block; }
  h1 { font-family: 'Unica One', sans-serif; font-size: 30px; letter-spacing: .03em; text-transform: uppercase; margin-top: 10px; line-height: 1.05; }
  .d-summary { font-size: 15px; color: var(--muted); margin-top: 10px; max-width: 720px; }
  .cta { display: inline-flex; align-items: center; gap: 10px; margin: 20px 0 6px; padding: 13px 22px; background: var(--red); color: #fff; text-decoration: none; border-radius: 8px; font-family: 'Unica One', sans-serif; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; transition: opacity .15s; }
  .cta:hover { opacity: .88; }
  .dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 28px; }
  .dgram { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s; }
  .dgram:hover { border-color: var(--border2); }
  .thumb { display: block; background: #fff; line-height: 0; border-bottom: 1px solid var(--border); }
  .thumb img { width: 100%; height: 190px; object-fit: contain; background: #fff; padding: 8px; }
  .dbody { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .dhead { display: flex; align-items: baseline; gap: 10px; }
  .dnum { font-family: 'Roboto Mono', monospace; font-size: 12px; color: var(--red); font-weight: 500; }
  .dtitle { font-size: 15px; font-weight: 500; color: var(--text); }
  .ddesc { font-size: 12px; color: var(--muted); line-height: 1.5; flex: 1; }
  .dlinks { display: flex; gap: 8px; margin-top: 4px; }
  .dlinks a { font-family: 'Roboto Mono', monospace; font-size: 11px; color: var(--muted); text-decoration: none; border: 1px solid var(--border); border-radius: 4px; padding: 4px 11px; }
  .dlinks a:hover { color: var(--red); border-color: var(--red); }
  .src-note { margin-top: 40px; font-size: 11px; color: var(--dim); font-family: 'Roboto Mono', monospace; border-top: 1px solid var(--border); padding-top: 14px; }
  .err { color: var(--red); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <a href="/" aria-label="Home"><svg width="80" height="21" viewBox="0 0 141 37" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.76011 3.9038C5.92786 3.74184 4.10895 4.35124 2.69056 5.6021C2.11733 6.19678 1.66843 6.91459 1.37363 7.70833C1.07884 8.50207 0.944757 9.35363 0.980235 10.2068V25.8829C0.944276 26.744 1.08103 27.6033 1.38128 28.4032C1.68152 29.203 2.13834 29.9249 2.72104 30.5204C4.16802 31.7349 5.9866 32.3289 7.82125 32.186C9.65242 32.3376 11.4679 31.7295 12.8909 30.4878C13.4641 29.8931 13.9129 29.1752 14.2077 28.3814C14.5025 27.5877 14.6366 26.7361 14.6011 25.8829V22.911H10.5088V25.8829C10.5269 26.1963 10.4816 26.5101 10.3763 26.8031C10.2709 27.0962 10.1077 27.3615 9.89795 27.5811C9.29929 28.0511 8.56102 28.2717 7.82125 28.2016C7.06115 28.2882 6.29829 28.0668 5.68342 27.5811C5.47026 27.3642 5.30488 27.0992 5.19924 26.8055C5.0936 26.5118 5.05041 26.1967 5.07267 25.8829V10.2068C5.05065 9.89591 5.09096 9.58361 5.19104 9.29072C5.29111 8.99783 5.44865 8.73115 5.65294 8.50864C6.25972 8.0309 7.01016 7.80989 7.76011 7.88813C8.52022 7.80157 9.28308 8.023 9.89795 8.50864C10.1077 8.72828 10.2709 8.99361 10.3763 9.28663C10.4816 9.57966 10.5269 9.89349 10.5088 10.2068V14.7464H14.6011V10.2068C14.6348 9.34798 14.4939 8.49156 14.1881 7.69657C13.8823 6.90158 13.4188 6.18702 12.8298 5.6021C11.4067 4.3604 9.59128 3.7522 7.76011 3.9038Z" fill="white"/><path d="M55.2655 21.0496L48.4551 4.52451H44.7598V31.631H48.8521V15.0732L55.632 31.631H59.3579V4.52451H55.2655V21.0496Z" fill="white"/><path d="M64.1953 31.631H68.2877V19.8739H74.3346V15.8896H68.2877V8.47617H75.8005V4.52451H64.1953V31.631Z" fill="white"/><path d="M84.731 4.52451H80.6387V31.631H91.4498V27.6466H84.731V4.52451Z" fill="white"/><path d="M96.2871 8.47617H98.1195V27.6466H96.2871V31.631H104.044V27.6466H102.212V8.47617H104.044V4.52451H96.2871V8.47617Z" fill="white"/><path d="M115.64 3.90374C113.817 3.74697 112.01 4.35626 110.601 5.60204C110.022 6.19287 109.57 6.91008 109.275 7.70478C108.98 8.49948 108.849 9.3     <span class="brand-div">×</span>
    <span class="brand-sub">DAS CDP</span>
  </div>
  <a class="back" href="deliverable.html">← All Deliverables</a>
</header>
<div class="wrap" id="wrap"><div style="color:var(--dim)">Loading…</div></div>
<script>
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
fetch('diagrams.json').then(r=>r.json()).then(data=>{
  document.title = data.title + ' — DAS CDP';
  const cards = (data.diagrams||[]).map(d=>`
    <div class="dgram">
      <a class="thumb" href="diagrams/${esc(d.slug)}.pdf" target="_blank" rel="noopener"><img src="diagrams/${esc(d.slug)}.png" loading="lazy" alt="${esc(d.title)}"></a>
      <div class="dbody">
        <div class="dhead"><span class="dnum">${esc(d.n)}</span><span class="dtitle">${esc(d.title)}</span></div>
        <div class="ddesc">${esc(d.desc)}</div>
        <div class="dlinks">
          <a href="diagrams/${esc(d.slug)}.png" download>PNG ↓</a>
          <a href="diagrams/${esc(d.slug)}.pdf" download>PDF ↓</a>
          <a href="https://lucid.app/lucidchart/${esc(d.lucid)}/view" target="_blank" rel="noopener">Lucid ↗</a>
        </div>
      </div>
    </div>`).join('');
  document.getElementById('wrap').innerHTML = `
    <div class="crumb"><a href="/">Command Center</a><span class="sep">/</span><a href="deliverable.html">Deliverables</a><span class="sep">/</span><span style="color:var(--muted)">Architecture Diagrams</span></div>
    <div class="d-label">Phase 0 Deliverable</div>
    <h1>${esc(data.title.replace('DAS CDP — ',''))}</h1>
    <p class="d-summary">${esc(data.summary)}</p>
    ${data.combined_pdf ? `<div><a class="cta" href="${esc(data.combined_pdf)}" download>Download all ten (PDF) ↓</a></div>` : ''}
    <div class="dgrid">${cards}</div>
    <div class="src-note">Source: Lucid (CONFLICT). Exported ${esc(data.updated)}. PNG and PDF are static exports; the Lucid link is the live editable source.</div>`;
}).catch(e=>{ document.getElementById('wrap').innerHTML = '<div class="err">Diagrams data unavailable (diagrams.json).</div>'; });
</script>
</body>
</html>
