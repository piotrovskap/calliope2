<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documentation — DAS CDP · CONFLICT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1D1D1D; --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.08);
    --border:rgba(168,168,167,.2); --border2:rgba(236,239,245,.15);
    --red:#DB394C; --red-dim:rgba(219,57,76,.1);
    --text:#FFFFFF; --muted:#A8A8A7; --dim:rgba(255,255,255,.3); --green:#4CAF50; --yellow:#F5A623;
    --blue:#4A7FA5; --purple:#7A5BA8; --radius:6px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Roboto',-apple-system,sans-serif; font-size:13px; line-height:1.6; min-height:100vh; }
  a { color:inherit; }

  /* ─── Top bar ─── */
  .topbar {
    border-bottom:1px solid var(--border); padding:0 32px; height:54px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; background:var(--bg); z-index:100;
  }
  .brand { display:flex; align-items:center; gap:14px; }
  .wordmark { font-family:'Unica One',sans-serif; font-size:17px; color:var(--red); letter-spacing:.1em; text-transform:uppercase; line-height:1; }
  .wordmark-sub { font-size:10px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:2px; }
  .topbar-right { display:flex; align-items:center; gap:14px; }
  .doc-count { font-family:'Roboto Mono',monospace; font-size:11px; color:var(--dim); }

  /* ─── Portal nav (sticky breadcrumb) ─── */
  .portal-nav {
    position:sticky; top:54px; z-index:90; background:var(--bg);
    border-bottom:1px solid var(--border); height:44px; display:flex; align-items:center;
    padding:0 32px; font-size:11px; font-family:'Roboto Mono',monospace;
  }
  .portal-nav a { color:var(--dim); text-decoration:none; }
  .portal-nav a:hover { color:var(--muted); }
  .portal-nav .sep { color:var(--border2); margin:0 10px; }
  .portal-nav .active { color:var(--red); }

  /* ─── Layout ─── */
  .layout { max-width:1240px; margin:0 auto; display:grid; grid-template-columns:248px 1fr; gap:0; }

  /* ─── Sidebar ─── */
  .sidebar {
    border-right:1px solid var(--border); padding:28px 22px;
    position:sticky; top:98px; align-self:start; height:calc(100vh - 98px); overflow-y:auto;
  }
  .sb-label {
    font-family:'Unica One',sans-serif; font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--dim); margin-bottom:14px; padding-bottom:9px; border-bottom:1px solid var(--border);
  }
  .sb-item {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 11px; border-radius:var(--radius); text-decoration:none; color:var(--muted);
    cursor:pointer; border:1px solid transparent; margin-bottom:4px; transition:background .12s,border-color .12s,color .12s;
  }
  .sb-item:hover { background:var(--surface); color:var(--text); }
  .sb-item.active { background:var(--red-dim); border-color:rgba(219,57,76,.35); color:var(--red); }
  .sb-item-label { font-size:12px; line-height:1.3; }
  .sb-item.active .sb-item-label { font-weight:500; }
  .sb-count {
    font-family:'Roboto Mono',monospace; font-size:10px; color:var(--dim);
    background:var(--surface2); border:1px solid var(--border); border-radius:3px; padding:0 6px; min-width:26px; text-align:center;
  }
  .sb-item.active .sb-count { color:var(--red); border-color:rgba(219,57,76,.35); background:transparent; }
  .sb-divider { height:1px; background:var(--border); margin:18px 0; }
  .sb-meta { font-family:'Roboto Mono',monospace; font-size:10px; color:var(--dim); line-height:1.7; }

  /* ─── Main ─── */
  .main { padding:32px; min-width:0; }
  .page-head { margin-bottom:24px; }
  .page-title { font-family:'Unica One',sans-serif; font-size:30px; letter-spacing:.02em; text-transform:uppercase; line-height:1; margin-bottom:8px; }
  .page-desc { font-size:13px; color:var(--muted); max-width:620px; }

  /* ─── Search ─── */
  .search-wrap { position:relative; margin-bottom:28px; }
  .search-input {
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    color:var(--text); font-family:'Roboto',sans-serif; font-size:13px; padding:11px 14px 11px 38px; outline:none; transition:border-color .12s;
  }
  .search-input::placeholder { color:var(--dim); }
  .search-input:focus { border-color:var(--red); }
  .search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:15px; height:15px; opacity:.4; pointer-events:none; }
  .search-clear {
    position:absolute; right:11px; top:50%; transform:translateY(-50%);
    font-family:'Roboto Mono',monospace; font-size:10px; color:var(--dim); background:var(--surface2);
    border:1px solid var(--border); border-radius:3px; padding:2px 7px; cursor:pointer; display:none;
  }
  .search-clear:hover { color:var(--muted); }
  .search-clear.show { display:block; }

  /* ─── Doc groups + cards ─── */
  .group { margin-bottom:34px; }
  .group-head {
    display:flex; align-items:baseline; gap:10px; margin-bottom:14px;
    padding-bottom:9px; border-bottom:1px solid var(--border);
  }
  .group-title { font-family:'Unica One',sans-serif; font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--text); }
  .group-count { font-family:'Roboto Mono',monospace; font-size:10px; color:var(--dim); }

  .card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(264px,1fr)); gap:12px; }
  .doc-card {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; text-decoration:none; color:inherit; display:flex; flex-direction:column; gap:10px;
    transition:border-color .12s,background .12s; position:relative; min-height:84px;
  }
  .doc-card:hover { border-color:var(--red); background:var(--surface2); }
  .doc-card-title {
    font-family:'Roboto',sans-serif; font-size:13px; font-weight:500; color:var(--text); line-height:1.35; flex:1;
  }
  .doc-card:hover .doc-card-title { color:var(--red); }
  .doc-card-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .badge {
    font-family:'Roboto Mono',monospace; font-size:9px; text-transform:uppercase; letter-spacing:.06em;
    padding:2px 7px; border-radius:3px; border:1px solid; white-space:nowrap;
  }
  .badge-wiki { color:var(--blue); border-color:rgba(74,127,165,.4); background:rgba(74,127,165,.1); }
  .badge-source { color:var(--muted); border-color:var(--border2); background:var(--surface2); }
  .badge-specs { color:var(--yellow); border-color:rgba(245,166,35,.4); background:rgba(245,166,35,.08); }
  .doc-card-ext { font-family:'Roboto Mono',monospace; font-size:9px; color:var(--dim); }

  /* ─── States ─── */
  .empty, .loading, .errorbox {
    border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);
    padding:40px 28px; text-align:center; color:var(--muted); font-size:13px;
  }
  .empty-title { font-family:'Unica One',sans-serif; font-size:18px; letter-spacing:.1em; text-transform:uppercase; color:var(--text); margin-bottom:6px; }
  .errorbox { border-color:rgba(219,57,76,.4); }
  .errorbox .empty-title { color:var(--red); }

  /* ─── Responsive ─── */
  @media (max-width:880px) {
    .layout { grid-template-columns:1fr; }
    .sidebar {
      position:static; height:auto; border-right:none; border-bottom:1px solid var(--border);
      padding:18px 22px;
    }
    .sb-list { display:flex; flex-wrap:wrap; gap:8px; }
    .sb-item { margin-bottom:0; flex:1 1 auto; }
    .sb-divider, .sb-meta { display:none; }
  }
  @media (max-width:560px) {
    .topbar, .portal-nav, .main { padding-left:18px; padding-right:18px; }
    .doc-count { display:none; }
  }
</style>
</head>

    <span style="color:var(--dim);margin:0 8px">×</span>
    <span style="font-family:'Unica One',sans-serif;font-size:13px;color:var(--muted);letter-spacing:.06em">DAS CDP</span>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sb-label">Collections</div>
    <div class="sb-list" id="sidebar">
      <!-- populated by JS -->

    <div class="sb-meta" id="sbMeta">loading…</div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="page-head">
      <h1 class="page-title" id="pageTitle">All Documentation</h1>
      <p class="page-desc" id="pageDesc">Search and browse every document in the DAS CDP workspace.</p>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="search-input" id="search" type="text" placeholder="Search documents by title…" autocomplete="off" spellcheck="false" aria-label="Search documents">
      <button class="search-clear" id="searchClear" type="button" aria-label="Clear search">clear</button>
    </div>

    <div id="results">
      <div class="loading">Loading documentation manifest…</div>
    </div>
  </main>

<script>
(function () {
  var state = { manifest: null, section: 'all', query: '' };
  var resultsEl = document.getElementById('results');
  var sidebarEl = document.getElementById('sidebar');
  var searchEl = document.getElementById('search');
  var searchClearEl = document.getElementById('searchClear');
  var pageTitleEl = document.getElementById('pageTitle');
  var pageDescEl = document.getElementById('pageDesc');
  var totalCountEl = document.getElementById('totalCount');
  var sbMetaEl = document.getElementById('sbMeta');

  var BADGE = { wiki: 'badge-wiki', 'das-source': 'badge-source', specs: 'badge-specs' };
  var BADGE_LABEL = { wiki: 'Wiki', 'das-source': 'DAS', specs: 'Spec' };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // Flatten a section into a list of {title, path, sectionId, groupLabel}
  function docsOf(section) {
    var out = [];
    if (section.docs) {
      section.docs.forEach(function (d) {
        out.push({ title: d.title, path: d.path, sectionId: section.id, groupLabel: null });
      });
    }
    if (section.groups) {
      section.groups.forEach(function (g) {
        g.docs.forEach(function (d) {
          out.push({ title: d.title, path: d.path, sectionId: section.id, groupLabel: g.label });
        });
      });
    }
    return out;
  }

  function allDocs() {
    var out = [];
    state.manifest.sections.forEach(function (s) { out = out.concat(docsOf(s)); });
    return out;
  }

  function cardHTML(doc) {
    var href = 'reader.html?f=' + encodeURIComponent(doc.path);
    var ext = doc.path.split('.').pop().toLowerCase();
    var badgeClass = BADGE[doc.sectionId] || 'badge-source';
    var badgeText = doc.groupLabel || BADGE_LABEL[doc.sectionId] || 'Doc';
    return '<a class="doc-card" href="' + href + '">' +
      '<span class="doc-card-title">' + esc(doc.title) + '</span>' +
      '<span class="doc-card-foot">' +
        '<span class="badge ' + badgeClass + '">' + esc(badgeText) + '</span>' +
        '<span class="doc-card-ext">.' + esc(ext) + '</span>' +
      '</span>' +
    '</a>';
  }

  function groupBlock(label, count, docs) {
    var cards = docs.map(cardHTML).join('');
    return '<section class="group">' +
      '<div class="group-head">' +
        '<span class="group-title">' + esc(label) + '</span>' +
        '<span class="group-count">' + count + (count === 1 ? ' doc' : ' docs') + '</span>' +
      '</div>' +
      '<div class="card-grid">' + cards + '</div>' +
    '</section>';
  }

  function matches(doc) {
    if (!state.query) return true;
    return doc.title.toLowerCase().indexOf(state.query) !== -1 ||
           doc.path.toLowerCase().indexOf(state.query) !== -1;
  }

  function render() {
    var html = '';
    var totalShown = 0;

    // Build the ordered list of sections to show
    var sections = state.section === 'all'
      ? state.manifest.sections
      : state.manifest.sections.filter(function (s) { return s.id === state.section; });

    sections.forEach(function (section) {
      // Section with subgroups -> render each group separately
      if (section.groups && section.groups.length) {
        section.groups.forEach(function (g) {
          var docs = g.docs
            .map(function (d) { return { title: d.title, path: d.path, sectionId: section.id, groupLabel: g.label }; })
            .filter(matches);
          if (docs.length) { totalShown += docs.length; html += groupBlock(g.label, docs.length, docs); }
        });
      } else {
        var docs = docsOf(section).filter(matches);
        if (docs.length) { totalShown += docs.length; html += groupBlock(section.label, docs.length, docs); }
      }
    });

    if (!totalShown) {
      html = '<div class="empty">' +
        '<div class="empty-title">No matches</div>' +
        (state.query ? 'No documents match “' + esc(state.query) + '”.' : 'No documents in this collection.') +
      '</div>';
    }
    resultsEl.innerHTML = html;
  }

  function renderSidebar() {
    var total = allDocs().length;
    totalCountEl.textContent = total + ' documents';

    var items = [{ id: 'all', label: 'All Documentation', count: total }];
    state.manifest.sections.forEach(function (s) {
      items.push({ id: s.id, label: s.label, count: s.count });
    });

    sidebarEl.innerHTML = items.map(function (it) {
      var active = it.id === state.section ? ' active' : '';
      return '<a class="sb-item' + active + '" data-section="' + it.id + '" role="button" tabindex="0">' +
        '<span class="sb-item-label">' + esc(it.label) + '</span>' +
        '<span class="sb-count">' + it.count + '</span>' +
      '</a>';
    }).join('');

    sbMetaEl.innerHTML = 'manifest · ' + (state.manifest.generated || '—') + '<br>' +
      state.manifest.sections.length + ' collections · ' + total + ' docs';

    // Wire up clicks
    Array.prototype.forEach.call(sidebarEl.querySelectorAll('.sb-item'), function (el) {
      function activate() {
        state.section = el.getAttribute('data-section');
        syncHeader();
        renderSidebar();
        render();
      }
      el.addEventListener('click', activate);
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
      });
    });
  }

  function syncHeader() {
    if (state.section === 'all') {
      pageTitleEl.textContent = 'All Documentation';
      pageDescEl.textContent = 'Search and browse every document in the DAS CDP workspace.';
      return;
    }
    var s = state.manifest.sections.filter(function (x) { return x.id === state.section; })[0];
    if (s) { pageTitleEl.textContent = s.label; pageDescEl.textContent = s.description; }
  }

  // Search handlers
  searchEl.addEventListener('input', function () {
    state.query = searchEl.value.trim().toLowerCase();
    searchClearEl.classList.toggle('show', !!searchEl.value);
    render();
  });
  searchClearEl.addEventListener('click', function () {
    searchEl.value = ''; state.query = '';
    searchClearEl.classList.remove('show');
    searchEl.focus();
    render();
  });

  // Load manifest
  fetch('./manifest.json', { cache: 'no-cache' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      state.manifest = data;
      renderSidebar();
      syncHeader();
      render();
    })
    .catch(function (err) {
      resultsEl.innerHTML = '<div class="errorbox">' +
        '<div class="empty-title">Failed to load manifest</div>' +
        'Could not fetch <code>manifest.json</code> (' + esc(err.message) + ').' +
      '</div>';
      sbMetaEl.textContent = 'manifest unavailable';
    });
})();
</script>

</body>
</html>
