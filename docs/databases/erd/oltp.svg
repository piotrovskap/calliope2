<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="monospace" font-size="12">
  <rect width="900" height="700" fill="#f8f9fa"/>
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">oltp — Response Logix Production (20.65.216.199:49577)</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#666">240 tables · 1.13B rows · 196 GB · Discovered 2026-06-14</text>

  <!-- customer -->
  <rect x="30" y="80" width="200" height="130" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="30" y="80" width="200" height="22" rx="4" fill="#495057"/>
  <text x="130" y="95" text-anchor="middle" fill="#fff" font-weight="bold">customer</text>
  <text x="40" y="117" fill="#333">PK customer_id INT</text>
  <text x="40" y="132" fill="#555">   name VARCHAR(50)</text>
  <text x="40" y="147" fill="#e55">   AccountId INT (→DAS?)</text>
  <text x="40" y="162" fill="#e55">   NewClientId INT (→CCID?)</text>
  <text x="40" y="177" fill="#555">   ClientId UUID</text>
  <text x="40" y="192" fill="#555">   reseller_id INT</text>

  <!-- franchise -->
  <rect x="280" y="80" width="210" height="145" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="280" y="80" width="210" height="22" rx="4" fill="#495057"/>
  <text x="385" y="95" text-anchor="middle" fill="#fff" font-weight="bold">franchise (9,920)</text>
  <text x="290" y="117" fill="#333">PK franchise_id INT</text>
  <text x="290" y="132" fill="#555">FK customer_id INT</text>
  <text x="290" y="147" fill="#555">   franchise_guid UUID</text>
  <text x="290" y="162" fill="#e55">   core_account_guid UUID</text>
  <text x="290" y="177" fill="#555">   oem_franchise_code</text>
  <text x="290" y="192" fill="#555">   lead_crm VARCHAR</text>
  <text x="290" y="207" fill="#555">   status VARCHAR(50)</text>

  <!-- franchise_consumer -->
  <rect x="30" y="270" width="220" height="160" rx="4" fill="#fff" stroke="#007bff" stroke-width="2"/>
  <rect x="30" y="270" width="220" height="22" rx="4" fill="#007bff"/>
  <text x="140" y="285" text-anchor="middle" fill="#fff" font-weight="bold">franchise_consumer (51M)</text>
  <text x="40" y="307" fill="#333">PK id INT</text>
  <text x="40" y="322" fill="#555">   franchise_consumer_id UUID</text>
  <text x="40" y="337" fill="#555">FK franchise_id INT</text>
  <text x="40" y="352" fill="#e55">   first/last VARCHAR</text>
  <text x="40" y="367" fill="#e55">   address/city/state/zip</text>
  <text x="40" y="382" fill="#555">   crm_reference VARCHAR</text>
  <text x="40" y="397" fill="#555">   status / consumer_purchased</text>
  <text x="40" y="412" fill="#555">   last_contact_date</text>

  <!-- franchise_consumer_alias -->
  <rect x="30" y="490" width="240" height="145" rx="4" fill="#fff" stroke="#28a745" stroke-width="2"/>
  <rect x="30" y="490" width="240" height="22" rx="4" fill="#28a745"/>
  <text x="150" y="505" text-anchor="middle" fill="#fff" font-weight="bold">franchise_consumer_alias (34M)</text>
  <text x="40" y="527" fill="#333">PK franchise_consumer_alias_id</text>
  <text x="40" y="542" fill="#555">FK franchise_consumer_id UUID</text>
  <text x="40" y="557" fill="#555">FK franchise_id INT</text>
  <text x="40" y="572" fill="#e55">   email (primary)</text>
  <text x="40" y="587" fill="#e55">   alias_1_email / alias_2_email</text>
  <text x="40" y="602" fill="#e55">   phone_1 / phone_2 / phone_3</text>
  <text x="40" y="617" fill="#555">   txn_id UUID</text>

  <!-- franchise_consumer_vehicle -->
  <rect x="310" y="490" width="230" height="145" rx="4" fill="#fff" stroke="#6f42c1" stroke-width="2"/>
  <rect x="310" y="490" width="230" height="22" rx="4" fill="#6f42c1"/>
  <text x="425" y="505" text-anchor="middle" fill="#fff" font-weight="bold">franchise_consumer_vehicle (29M)</text>
  <text x="320" y="527" fill="#333">PK franchise_consumer_vehicle_id</text>
  <text x="320" y="542" fill="#555">FK franchise_consumer_id UUID</text>
  <text x="320" y="557" fill="#555">FK vehicle_id INT</text>
  <text x="320" y="572" fill="#e55">   vin VARCHAR(20)</text>
  <text x="320" y="587" fill="#555">   make / year / model</text>
  <text x="320" y="602" fill="#555">   type (new/used)</text>
  <text x="320" y="617" fill="#555">   txn_id UUID</text>

  <!-- lead -->
  <rect x="580" y="270" width="290" height="175" rx="4" fill="#fff" stroke="#fd7e14" stroke-width="2"/>
  <rect x="580" y="270" width="290" height="22" rx="4" fill="#fd7e14"/>
  <text x="725" y="285" text-anchor="middle" fill="#fff" font-weight="bold">lead (11M)</text>
  <text x="590" y="307" fill="#333">PK lead_number INT</text>
  <text x="590" y="322" fill="#555">   lead_id UUID</text>
  <text x="590" y="337" fill="#555">FK franchise_id INT</text>
  <text x="590" y="352" fill="#555">FK customer_id INT</text>
  <text x="590" y="367" fill="#e55">   email / home_phone / mobile_phone</text>
  <text x="590" y="382" fill="#e55">   first / last / address</text>
  <text x="590" y="397" fill="#e55">   lp_vin / lp_lead_number</text>
  <text x="590" y="412" fill="#555">   lead_provider_name</text>
  <text x="590" y="427" fill="#555">   crm_reference / status</text>

  <!-- smart_quote -->
  <rect x="580" y="490" width="290" height="115" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <rect x="580" y="490" width="290" height="22" rx="4" fill="#6c757d"/>
  <text x="725" y="505" text-anchor="middle" fill="#fff" font-weight="bold">smart_quote (25M)</text>
  <text x="590" y="527" fill="#555">PK smart_quote_id UUID</text>
  <text x="590" y="542" fill="#555">FK lead_id UUID</text>
  <text x="590" y="557" fill="#e55">   email / home_phone / vin</text>
  <text x="590" y="572" fill="#555">   franchise_reference</text>
  <text x="590" y="587" fill="#555">   is_billable / smart_quote_date</text>

  <!-- Arrows: customer → franchise -->
  <line x1="230" y1="145" x2="280" y2="145" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- franchise → franchise_consumer -->
  <line x1="385" y1="225" x2="385" y2="265" stroke="#333" stroke-width="1.5"/>
  <line x1="385" y1="265" x2="140" y2="265" stroke="#333" stroke-width="1.5"/>
  <line x1="140" y1="265" x2="140" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- franchise_consumer → franchise_consumer_alias -->
  <line x1="140" y1="430" x2="140" y2="490" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- franchise_consumer → franchise_consumer_vehicle -->
  <line x1="250" y1="350" x2="295" y2="350" stroke="#6f42c1" stroke-width="1.5"/>
  <line x1="295" y1="350" x2="295" y2="555" stroke="#6f42c1" stroke-width="1.5"/>
  <line x1="295" y1="555" x2="310" y2="555" stroke="#6f42c1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- franchise → lead -->
  <line x1="490" y1="150" x2="540" y2="150" stroke="#fd7e14" stroke-width="1.5"/>
  <line x1="540" y1="150" x2="540" y2="350" stroke="#fd7e14" stroke-width="1.5"/>
  <line x1="540" y1="350" x2="580" y2="350" stroke="#fd7e14" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- lead → smart_quote -->
  <line x1="725" y1="445" x2="725" y2="490" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="620" y="80" width="250" height="105" rx="4" fill="#f1f3f5" stroke="#dee2e6"/>
  <text x="745" y="100" text-anchor="middle" font-weight="bold" fill="#333">Legend</text>
  <rect x="630" y="108" width="12" height="12" fill="#007bff"/>
  <text x="648" y="119" fill="#333">Consumer identity tables</text>
  <rect x="630" y="124" width="12" height="12" fill="#28a745"/>
  <text x="648" y="135" fill="#333">Alias / identity expansion</text>
  <rect x="630" y="140" width="12" height="12" fill="#fd7e14"/>
  <text x="648" y="151" fill="#333">Lead tables</text>
  <rect x="630" y="156" width="12" height="12" fill="#6f42c1"/>
  <text x="648" y="167" fill="#333">Vehicle linkage</text>
  <text x="630" y="180" fill="#e55" font-size="11">Red text = PII / identity fields</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
