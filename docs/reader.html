<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader — DAS CDP · CONFLICT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1D1D1D; --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.08);
    --border:rgba(168,168,167,.2); --border2:rgba(236,239,245,.15);
    --red:#DB394C; --red-dim:rgba(219,57,76,.1);
    --text:#FFFFFF; --muted:#A8A8A7; --dim:rgba(255,255,255,.3); --green:#4CAF50; --yellow:#F5A623;
    --blue:#4A7FA5; --purple:#7A5BA8; --radius:6px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Roboto',-apple-system,sans-serif; font-size:14px; line-height:1.7; min-height:100vh; }

  /* ─── Top bar ─── */
  .topbar {
    border-bottom:1px solid var(--border); padding:0 32px; height:54px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; background:var(--bg); z-index:100;
  }
  .brand { display:flex; align-items:center; gap:14px; }
  .wordmark { font-family:'Unica One',sans-serif; font-size:17px; color:var(--red); letter-spacing:.1em; text-transform:uppercase; line-height:1; }
  .wordmark-sub { font-size:10px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:2px; }
  .back-btn { font-size:11px; color:var(--muted); text-decoration:none; border:1px solid var(--border); border-radius:4px; padding:5px 13px; font-family:'Roboto',sans-serif; transition:border-color .12s,color .12s; }
  .back-btn:hover { border-color:var(--red); color:var(--red); }

  /* ─── Portal nav ─── */
  .portal-nav {
    position:sticky; top:54px; z-index:90; background:var(--bg);
    border-bottom:1px solid var(--border); height:44px; display:flex; align-items:center;
    padding:0 32px; font-size:11px; font-family:'Roboto Mono',monospace;
  }
  .portal-nav a { color:var(--dim); text-decoration:none; }
  .portal-nav a:hover { color:var(--muted); }
  .portal-nav .sep { color:var(--border2); margin:0 10px; }
  .portal-nav .active { color:var(--red); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:46vw; }

  /* ─── Doc shell ─── */
  .shell { max-width:860px; margin:0 auto; padding:40px 32px 96px; }
  .doc-head { margin-bottom:8px; }
  .doc-title { font-family:'Unica One',sans-serif; font-size:34px; letter-spacing:.02em; text-transform:uppercase; line-height:1.05; color:var(--text); }
  .doc-path { font-family:'Roboto Mono',monospace; font-size:11px; color:var(--dim); margin-bottom:20px; word-break:break-all; }
  .doc-meta { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 20px; }
  .doc-meta .chip { font-family:'Roboto Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); background:var(--surface); border:1px solid var(--border); border-radius:3px; padding:3px 9px; }
  .doc-meta a.orig { font-family:'Roboto Mono',monospace; font-size:11px; color:var(--red); text-decoration:none; border:1px solid rgba(219,57,76,.4); border-radius:3px; padding:3px 10px; }
  .doc-meta a.orig:hover { background:var(--red-dim); }
  .doc-note { font-size:12px; color:var(--muted); background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--yellow); border-radius:4px; padding:10px 14px; margin:0 0 24px; line-height:1.6; }
  .doc-note strong { color:var(--text); }
  .doc-divider { height:1px; background:var(--border); margin-bottom:32px; }

  /* ─── States ─── */
  .statebox { border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); padding:48px 32px; text-align:center; color:var(--muted); font-size:14px; }
  .statebox .st-title { font-family:'Unica One',sans-serif; font-size:20px; letter-spacing:.1em; text-transform:uppercase; color:var(--text); margin-bottom:8px; }
  .statebox.error { border-color:rgba(219,57,76,.4); }
  .statebox.error .st-title { color:var(--red); }
  .statebox code { font-family:'Roboto Mono',monospace; font-size:12px; color:var(--muted); background:var(--surface2); border:1px solid var(--border); border-radius:3px; padding:2px 6px; }
  .statebox .back-link { display:inline-block; margin-top:20px; color:var(--red); text-decoration:none; font-size:12px; border:1px solid rgba(219,57,76,.4); border-radius:4px; padding:6px 14px; }
  .statebox .back-link:hover { background:var(--red-dim); }
  .spinner { display:inline-block; width:22px; height:22px; border:2px solid var(--border); border-top-color:var(--red); border-radius:50%; animation:spin .7s linear infinite; margin-bottom:16px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ─── Rendered markdown typography ─── */
  .md { color:var(--text); }
  .md > *:first-child { margin-top:0; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    font-family:'Unica One',sans-serif; letter-spacing:.03em; text-transform:uppercase;
    color:var(--text); line-height:1.15; margin:36px 0 14px;
  }
  .md h1 { font-size:30px; padding-bottom:10px; border-bottom:1px solid var(--border); }
  .md h2 { font-size:23px; padding-bottom:8px; border-bottom:1px solid var(--border); }
  .md h3 { font-size:18px; color:var(--red); }
  .md h4 { font-size:15px; letter-spacing:.08em; color:var(--muted); }
  .md h5, .md h6 { font-size:13px; letter-spacing:.1em; color:var(--muted); }
  .md p { margin:0 0 16px; }
  .md a { color:var(--red); text-decoration:none; border-bottom:1px solid rgba(219,57,76,.3); }
  .md a:hover { border-bottom-color:var(--red); }
  .md strong { font-weight:700; color:var(--text); }
  .md em { color:var(--text); }
  .md ul, .md ol { margin:0 0 16px; padding-left:24px; }
  .md li { margin:5px 0; }
  .md li::marker { color:var(--red); }
  .md hr { border:none; border-top:1px solid var(--border); margin:32px 0; }
  .md blockquote {
    border-left:3px solid var(--red); background:var(--surface); margin:0 0 16px;
    padding:12px 18px; color:var(--muted); border-radius:0 var(--radius) var(--radius) 0;
  }
  .md blockquote p:last-child { margin-bottom:0; }

  /* inline + block code */
  .md code {
    font-family:'Roboto Mono',monospace; font-size:.86em; color:var(--yellow);
    background:var(--surface2); border:1px solid var(--border); border-radius:3px; padding:1px 5px;
  }
  .md pre {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; overflow-x:auto; margin:0 0 18px; line-height:1.55;
  }
  .md pre code {
    color:var(--text); background:none; border:none; padding:0; font-size:12.5px; white-space:pre;
  }

  /* tables */
  .md table { width:100%; border-collapse:collapse; margin:0 0 18px; font-size:13px; display:block; overflow-x:auto; }
  .md th, .md td { border:1px solid var(--border); padding:8px 12px; text-align:left; vertical-align:top; }
  .md th {
    font-family:'Roboto Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); background:var(--surface2); font-weight:500;
  }
  .md tr:nth-child(even) td { background:var(--surface); }

  /* Re-pulled Confluence exports carry inline light backgrounds (info/note/code panels,
     placeholder bg-images) + dark text — neutralize for the dark theme. Stylesheet
     !important overrides the non-important inline styles. */
  .md .panel, .md .panelContent, .md .code, .md .codeContent,
  .md [style*="background-color"], .md [style*="background:"], .md [style*="background-image"] {
    background: var(--surface) !important;
    background-image: none !important;
    border-color: var(--border) !important;
    color: var(--text) !important;
  }
  .md .panel, .md .code { border:1px solid var(--border) !important; border-radius:6px; padding:2px 0; }
  .md [style*="color:"] { color: var(--text) !important; }

  /* images */
  .md img { max-width:100%; height:auto; border:1px solid var(--border); border-radius:var(--radius); margin:4px 0 18px; }

  /* footer back */
  .doc-foot { margin-top:48px; padding-top:24px; border-top:1px solid var(--border); }
  .doc-foot a { color:var(--muted); text-decoration:none; font-size:12px; border:1px solid var(--border); border-radius:4px; padding:7px 15px; transition:border-color .12s,color .12s; }
  .doc-foot a:hover { border-color:var(--red); color:var(--red); }

  @media (max-width:560px) {
    .topbar, .portal-nav, .shell { padding-left:18px; padding-right:18px; }
    .wordmark-sub { display:none; }
  }
</style>
<!-- Additive rich-markdown capability styles (KBRender, issue #20) — base theme above is unchanged. -->

    <span style="color:var(--dim);margin:0 8px">×</span>

<!-- Portal nav -->
<nav class="portal-nav">
  <a href="/">Home</a>
  <span class="sep">/</span>
  <a href="index.html">Documentation</a>
  <span class="sep">/</span>
  <span class="active" id="navCrumb">…</span>
</nav>

<div class="shell">
  <div class="doc-head">
    <h1 class="doc-title" id="docTitle">&nbsp;</h1>
  </div>
  <div class="doc-path" id="docPath"></div>
  <div class="doc-divider" id="docDivider" style="display:none"></div>

  <div id="content">
    <div class="statebox">
      <div class="spinner"></div>
      <div class="st-title">Loading</div>
      <div>Fetching document…</div>
    </div>
  </div>

  <div class="doc-foot" id="docFoot" style="display:none">
    <a href="index.html">← Browse Docs</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-footnote/dist/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="../app/render.js"></script>
<script>
(function () {
  var contentEl = document.getElementById('content');
  var titleEl = document.getElementById('docTitle');
  var pathEl = document.getElementById('docPath');
  var crumbEl = document.getElementById('navCrumb');
  var dividerEl = document.getElementById('docDivider');
  var footEl = document.getElementById('docFoot');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function titleFromPath(path) {
    var file = path.split('/').pop().replace(/\.md$/i, '');
    var words = file.replace(/[-_]+/g, ' ').trim().split(/\s+/);
    return words.map(function (w) {
      return w ? w.charAt(0).toUpperCase() + w.slice(1) : w;
    }).join(' ');
  }

  // Split YAML frontmatter from the markdown body so the `---` block renders as
  // a clean metadata header instead of raw text.
  function parseFrontmatter(md) {
    md = md.replace(/^﻿/, '');
    var m = /^---\s*\n([\s\S]*?)\n---\s*\n?/.exec(md);
    if (!m) return { meta: null, body: md };
    var meta = {};
    m[1].split('\n').forEach(function (line) {
      var i = line.indexOf(':');
      if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim().replace(/^["']|["']$/g, '');
    });
    return { meta: meta, body: md.slice(m[0].length) };
  }

  function renderMeta(meta) {
    if (!meta) return '';
    var chips = [];
    if (meta.source)   chips.push('<span class="chip">' + esc(meta.source) + '</span>');
    if (meta.version)  chips.push('<span class="chip">' + esc(meta.version) + '</span>');
    if (meta.page_id)  chips.push('<span class="chip">page ' + esc(meta.page_id) + '</span>');
    var orig = meta.url ? '<a class="orig" href="' + esc(meta.url) + '" target="_blank" rel="noopener">View original ↗</a>' : '';
    var bar = (chips.length || orig) ? '<div class="doc-meta">' + chips.join('') + orig + '</div>' : '';
    var note = (meta.type === 'confluence-doc' && !meta.repulled)
      ? '<div class="doc-note">Flattened <strong>Confluence export</strong> — structure not preserved. Use <strong>View original ↗</strong> for the original page.</div>'
      : '';
    return bar + note;
  }

  function showError(title, detail) {
    titleEl.textContent = 'Not Found';
    crumbEl.textContent = 'Error';
    contentEl.innerHTML = '<div class="statebox error">' +
      '<div class="st-title">' + esc(title) + '</div>' +
      '<div>' + detail + '</div>' +
      '<a class="back-link" href="index.html">← Back to documentation</a>' +
    '</div>';
  }

  // Parse ?f= param
  var params = new URLSearchParams(window.location.search);
  var rawPath = params.get('f');

  if (!rawPath) {
    pathEl.textContent = '';
    showError('No document specified', 'This page expects a <code>?f=</code> query parameter pointing at a markdown file.');
    return;
  }

  // Decode and guard against path escaping the repo root.
  var path = decodeURIComponent(rawPath);
  if (path.indexOf('..') !== -1 || /^https?:/i.test(path) || path.charAt(0) === '/') {
    showError('Invalid path', 'The requested path <code>' + esc(path) + '</code> is not allowed.');
    return;
  }

  // Reader lives at /docs/reader.html; manifest paths are relative to repo root.
  var fetchUrl = '../' + path;
  var derivedTitle = titleFromPath(path);

  // Optimistically set the title/crumb from the path; manifest title isn't
  // available here, so the filename-derived title keeps the header populated.
  titleEl.textContent = derivedTitle;
  crumbEl.textContent = derivedTitle;
  document.title = derivedTitle + ' — DAS CDP · CONFLICT';
  pathEl.textContent = path;

  if (typeof marked === 'undefined') {
    showError('Renderer unavailable', 'The markdown renderer (marked.js) failed to load from the CDN.');
    return;
  }

  marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });
  // Footnotes: register the marked extension if it loaded (KBRender handles the rest).
  if (window.markedFootnote) { try { marked.use(window.markedFootnote()); } catch (e) {} }

  fetch(fetchUrl, { cache: 'no-cache' })
    .then(function (r) {
      if (r.status === 404) throw new Error('404');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (md) {
      var fm = parseFrontmatter(md);
      var body = fm.body;
      if (fm.meta && fm.meta.title) {
        titleEl.textContent = fm.meta.title;
        crumbEl.textContent = fm.meta.title;
        document.title = fm.meta.title + ' — DAS CDP · CONFLICT';
        // Drop a leading H1 that just repeats the title (shown in the header already).
        body = body.replace(/^\s*#\s+.+\r?\n+/, '');
      }
      contentEl.innerHTML = renderMeta(fm.meta) + '<div class="md" id="mdBody"></div>';
      var mdBody = document.getElementById('mdBody');
      // KBRender adds Mermaid, code highlighting, callouts, footnotes, task lists.
      // Fall back to bare marked if render.js failed to load (graceful degradation).
      if (window.KBRender) { KBRender.render(body, mdBody); }
      else { mdBody.innerHTML = marked.parse(body); }
      // Make in-doc links to repo .md/.json open IN the reader (resolved relative
      // to this doc), so cross-references navigate the portal instead of dumping
      // raw files. render.js already linkified bare code-paths; this catches
      // authored markdown links and absolute paths.
      (function rewireDocLinks() {
        var dir = path.replace(/[^/]*$/, '');           // this doc's folder
        var base = 'https://x/' + dir;
        mdBody.querySelectorAll('a[href]').forEach(function (a) {
          var raw = a.getAttribute('href') || '';
          if (/^(https?:|mailto:|#)/i.test(raw)) return;        // external / pure in-page anchor
          if (/reader\.html\?f=/.test(raw)) return;             // already a reader link
          var u; try { u = new URL(raw, base); } catch (e) { return; }
          var repoPath = u.pathname.replace(/^\//, '');
          if (!/\.(md|json)$/i.test(repoPath)) return;          // only doc files
          a.setAttribute('href', 'reader.html?f=' + repoPath + (u.hash || ''));
        });
      })();
      // Scroll to a #fragment (heading ids today; per-decision anchors later) after async render.
      if (window.location.hash) {
        var frag = document.getElementById(decodeURIComponent(window.location.hash.slice(1)));
        if (frag) frag.scrollIntoView();
      }
      dividerEl.style.display = 'block';
      footEl.style.display = 'block';
    })
    .catch(function (err) {
      if (err.message === '404') {
        showError('Document not found', 'No file exists at <code>' + esc(path) + '</code>.');
      } else {
        showError('Failed to load', 'Could not fetch <code>' + esc(path) + '</code> (' + esc(err.message) + ').');
      }
    });
})();
</script>

</body>
</html>
