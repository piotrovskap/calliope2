<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artifacts — DAS CDP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1D1D1D; --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.08);
    --border:rgba(168,168,167,.2); --border2:rgba(236,239,245,.15);
    --red:#DB394C; --red-dim:rgba(219,57,76,.1);
    --text:#FFFFFF; --muted:#A8A8A7; --dim:rgba(255,255,255,.3);
    --green:#4CAF50; --yellow:#F5A623; --blue:#4A7FA5; --purple:#7A5BA8;
    --radius:6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; font-size: 13px; line-height: 1.6; min-height: 100vh; }

  .portal-nav { height: 34px; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 16px; font-size: 11px; position: sticky; top: 0; z-index: 200; }
  .portal-nav a { color: var(--dim); text-decoration: none; font-family: 'Roboto Mono', monospace; }
  .portal-nav a:hover { color: var(--muted); }
  .nav-sep { color: var(--border2); }

  .page-header { max-width: 1000px; margin: 0 auto; padding: 36px 32px 24px; border-bottom: 1px solid var(--border); }
  .artifact-label { font-family: 'Roboto Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--red); background: var(--red-dim); border: 1px solid rgba(219,57,76,.3); border-radius: 3px; padding: 2px 8px; display: inline-block; }
  h1 { font-family: 'Unica One', sans-serif; font-size: 28px; letter-spacing: .04em; text-transform: uppercase; color: var(--text); margin-top: 8px; line-height: 1; }
  .header-desc { font-size: 13px; color: var(--muted); max-width: 580px; line-height: 1.6; margin-top: 8px; }

  .grid-wrap { max-width: 1000px; margin: 24px auto 56px; padding: 0 32px; }
  .artifacts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .artifact-card {
    display: flex; flex-direction: column; gap: 6px; padding: 16px;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
    text-decoration: none; color: inherit; transition: border-color .15s, background .15s;
  }
  a.artifact-card:hover { border-color: var(--border2); background: var(--surface2); }
  .artifact-card.unavailable { opacity: .5; }
  .artifact-icon { font-family: 'Roboto Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: .08em; color: var(--red); }
  .artifact-title { font-size: 14px; font-weight: 500; color: var(--text); }
  .artifact-desc { font-size: 12px; color: var(--muted); line-height: 1.5; flex: 1; }
  .artifact-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .artifact-type-label { font-family: 'Roboto Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); border: 1px solid var(--border); border-radius: 2px; padding: 1px 6px; }
  .artifact-date { font-family: 'Roboto Mono', monospace; font-size: 10px; color: var(--dim); }
  .artifact-pending { font-family: 'Roboto Mono', monospace; font-size: 10px; color: var(--yellow); }

  .page-footer { border-top: 1px solid var(--border); padding: 16px 32px; font-size: 10px; color: var(--dim); font-family: 'Roboto Mono', monospace; display: flex; justify-content: space-between; }
</style>
</head>
<body>

<nav class="portal-nav">
  <a href="/">← Command Center</a>
  <span class="nav-sep">/</span>
  <a href="../">Sessions &amp; Repository</a>
  <span class="nav-sep">/</span>
  <span style="color:var(--muted)">Artifacts</span>
</nav>

<div class="page-header">
  <div class="artifact-label">Repository</div>
  <h1>Artifacts</h1>
  <p class="header-desc">Every analysis artifact produced during the engagement — diagrams, catalogs, trackers, and documents. Source of truth: <code style="font-size:11px;color:var(--muted)">analysis/catalog.json</code>.</p>
</div>

<div class="grid-wrap">
  <div class="artifacts-grid" id="grid">
    <div style="color:var(--dim);font-size:12px;padding:8px 0;">Loading artifacts…</div>
  </div>
</div>

<footer class="page-footer">
  <span>DAS CDP · Artifacts · Phase 0 · Conflict</span>
  <span id="footer-count"></span>
</footer>

<script>
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// hrefs in artifact JSON are relative to analysis/; this page lives in analysis/artifacts/, so prepend ../
function resolveHref(h){ return h ? (h.startsWith('/') ? h : '../' + h) : ''; }

function card(art){
  if (!art) return '';
  const hasHref = !!art.href;
  const tag = hasHref ? 'a' : 'div';
  const attrs = hasHref ? `href="${resolveHref(art.href)}"` : '';
  const cls = hasHref ? '' : 'unavailable';
  return `<${tag} class="artifact-card ${cls}" ${attrs}>
    <div class="artifact-icon">${esc(art.icon)}</div>
    <div class="artifact-title">${esc(art.title)}</div>
    <div class="artifact-desc">${esc(art.description)}</div>
    <div class="artifact-footer">
      <span class="artifact-type-label">${esc((art.type||'').replace('-',' '))}</span>
      ${art.updated ? `<span class="artifact-date">${esc(art.updated)}</span>` : `<span class="artifact-pending">pending</span>`}
    </div>
  </${tag}>`;
}

async function load(){
  const grid = document.getElementById('grid');
  try {
    const catalog = await fetch('../catalog.json').then(r => r.json());
    const ids = catalog.artifacts || [];
    const arts = await Promise.all(ids.map(id =>
      fetch(`./${id}.json`).then(r => r.ok ? r.json() : null).catch(() => null)
    ));
    const cards = arts.filter(Boolean).map(card).join('');
    grid.innerHTML = cards || '<div style="color:var(--dim)">No artifacts</div>';
    const count = arts.filter(Boolean).length;
    document.getElementById('footer-count').textContent = count + ' artifact' + (count !== 1 ? 's' : '');
  } catch(e) {
    grid.innerHTML = '<div style="color:var(--red);font-size:12px;padding:8px 0;">Artifacts unavailable — catalog.json not found</div>';
  }
}
load();
</script>
</body>
</html>
