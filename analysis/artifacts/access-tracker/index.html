<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Tracker — DAS CDP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1D1D1D; --surface: #111; --surface2: #1a1a1a;
    --border: #2a2a2a; --border2: #333;
    --red: #DB394C; --red-dim: rgba(219,57,76,0.1);
    --text: #F8F8F8; --muted: #888; --dim: #444;
    --green: #4CAF50; --green-dim: rgba(76,175,80,0.12);
    --yellow: #F5A623; --yellow-dim: rgba(245,166,35,0.1);
    --blue: #4A7FA5; --blue-dim: rgba(74,127,165,0.12);
    --purple: #7A5BA8;
    --radius: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Roboto', sans-serif; font-size: 13px; line-height: 1.6; }

  /* Nav */
  .portal-nav { height: 34px; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 20px; font-size: 11px; }
  .portal-nav a { color: var(--dim); text-decoration: none; }
  .portal-nav a:hover { color: var(--muted); }
  .nav-sep { color: var(--border2); }

  /* Header */
  .page-header {
    max-width: 1100px; margin: 0 auto; padding: 36px 32px 24px;
    border-bottom: 1px solid var(--border);
  }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
  .artifact-label { font-family: 'Roboto Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--red); background: var(--red-dim); border: 1px solid rgba(219,57,76,.3); border-radius: 3px; padding: 2px 8px; }
  h1 { font-family: 'Unica One', sans-serif; font-size: 28px; letter-spacing: .04em; text-transform: uppercase; color: var(--text); line-height: 1; margin-top: 8px; }
  .header-desc { font-size: 13px; color: var(--muted); max-width: 580px; line-height: 1.6; margin-top: 8px; }

  /* Summary strip */
  .summary-strip { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin: 24px 32px; max-width: 1036px; margin-left: auto; margin-right: auto; }
  .summary-strip { max-width: calc(1100px - 64px); margin: 24px auto; }
  .sum-item { flex: 1; padding: 14px 20px; text-align: center; border-right: 1px solid var(--border); background: var(--surface); }
  .sum-item:last-child { border-right: none; }
  .sum-num { font-family: 'Unica One', sans-serif; font-size: 22px; line-height: 1; margin-bottom: 3px; }
  .sum-label { font-size: 9px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); }

  /* Table */
  .table-wrap { max-width: 1100px; margin: 0 auto; padding: 0 32px 48px; }
  .table-section { margin-bottom: 32px; }
  .section-label {
    font-family: 'Unica One', sans-serif; font-size: 11px; letter-spacing: .15em;
    text-transform: uppercase; color: var(--dim); margin-bottom: 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px;
  }
  .section-label .caret { font-size: 11px; transition: transform .15s ease; }
  .section-label .section-count { margin-left: auto; font-size: 10px; letter-spacing: .06em; color: var(--green); text-transform: none; }
  .table-section.collapsed .section-label { margin-bottom: 0; }
  .table-section.collapsed .section-label .caret { transform: rotate(-90deg); }
  .table-section.collapsed table { display: none; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    font-family: 'Roboto Mono', monospace; font-size: 9px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--dim); padding: 8px 12px;
    border-bottom: 1px solid var(--border); text-align: left; background: var(--surface);
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:hover { background: var(--surface); }
  tbody td { padding: 10px 12px; vertical-align: top; font-size: 12px; }

  /* Status badges */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: 'Roboto Mono', monospace; font-size: 9px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em;
    padding: 2px 8px; border-radius: 3px; border: 1px solid; white-space: nowrap;
  }
  .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .s-granted  { color: var(--green);  border-color: rgba(76,175,80,.4);  background: var(--green-dim); }
  .s-committed{ color: var(--blue);   border-color: rgba(74,127,165,.4); background: var(--blue-dim); }
  .s-pending  { color: var(--yellow); border-color: rgba(245,166,35,.4); background: var(--yellow-dim); }
  .s-blocked  { color: var(--red);    border-color: rgba(219,57,76,.4);  background: var(--red-dim); }
  .s-na       { color: var(--dim);    border-color: var(--border);       background: var(--surface2); }

  /* Type chip */
  .type-chip {
    font-family: 'Roboto Mono', monospace; font-size: 9px; color: var(--muted);
    background: var(--surface2); border: 1px solid var(--border); border-radius: 2px;
    padding: 1px 6px; white-space: nowrap;
  }

  .resource-name { font-weight: 500; color: var(--text); }
  .resource-note { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .owner-name { color: var(--muted); }
  .session-ref { font-family: 'Roboto Mono', monospace; font-size: 10px; color: var(--dim); }

  /* Footer */
  .page-footer { border-top: 1px solid var(--border); padding: 16px 32px; font-size: 11px; color: var(--dim); font-family: 'Roboto Mono', monospace; }
</style>
</head>
<body>

<nav class="portal-nav">
  <a href="../../../">← Command Center</a>
  <span class="nav-sep">/</span>
  <a href="../">Repository</a>
  <span class="nav-sep">/</span>
  <span style="color:var(--muted)">Access Tracker</span>
</nav>

<div class="page-header">
  <div class="header-top">
    <div>
      <div class="artifact-label">Access Tracker</div>
      <h1>System Access</h1>
      <p class="header-desc">Tracks database, tool, and resource access requested or required for the CDP engagement. Update status as access is granted or blocked.</p>
    </div>
  </div>
</div>

<!-- Summary (auto-computed from access.json) -->
<div class="summary-strip" id="summary-strip"></div>

<div class="table-wrap" id="table-wrap"></div>

<footer class="page-footer" id="page-footer">DAS CDP · Access Tracker · Phase 0 · Conflict</footer>

<script>
// Status display order + accent colors for the summary strip. Mirrors the
// status values in access.json. `na` is tracked but, like the original page,
// not surfaced as its own summary column.
var SUMMARY_STATUSES = [
  { key: 'granted',   label: 'Granted',   color: 'var(--green)'  },
  { key: 'committed', label: 'Committed', color: 'var(--blue)'   },
  { key: 'pending',   label: 'Pending',   color: 'var(--yellow)' },
  { key: 'blocked',   label: 'Blocked',   color: 'var(--red)'    }
];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

// Capitalize a status key for the badge label: 'committed' -> 'Committed'.
function statusLabel(s) {
  s = String(s || '');
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// Render a session reference as "<name><br><date>", splitting off a trailing
// -YYYY-MM-DD. Null/empty sessions render as an em dash, matching the original.
function sessionCell(session) {
  if (!session) return '—';
  var m = String(session).match(/^(.*)-(\d{4}-\d{2}-\d{2})$/);
  if (m) return esc(m[1]) + '<br>' + esc(m[2]);
  return esc(session);
}

function rowHTML(item) {
  return '<tr>' +
    '<td>' +
      '<div class="resource-name">' + esc(item.resource) + '</div>' +
      (item.note ? '<div class="resource-note">' + esc(item.note) + '</div>' : '') +
    '</td>' +
    '<td><span class="type-chip">' + esc(item.type) + '</span></td>' +
    '<td><span class="badge s-' + esc(item.status) + '">' + esc(statusLabel(item.status)) + '</span></td>' +
    '<td class="owner-name">' + esc(item.owner) + '</td>' +
    '<td class="owner-name">' + esc(item.requestedBy) + '</td>' +
    '<td class="resource-note">' + esc(item.detail) + '</td>' +
    '<td class="session-ref">' + sessionCell(item.session) + '</td>' +
  '</tr>';
}

// A section is "resolved" (collapsed by default) when every item is granted or
// not-needed (na) — i.e. nothing is still pending/committed/blocked.
function sectionResolved(section) {
  var items = section.items || [];
  return items.length > 0 && items.every(function (it) {
    return it.status === 'granted' || it.status === 'na';
  });
}

function sectionHTML(section) {
  var items = section.items || [];
  var rows = items.map(rowHTML).join('');
  var done = sectionResolved(section);
  return '<div class="table-section' + (done ? ' collapsed' : '') + '">' +
    '<div class="section-label"><span class="caret">▾</span>' + esc(section.label) +
      (done ? '<span class="section-count">' + items.length + ' resolved</span>' : '') +
    '</div>' +
    '<table>' +
      '<thead>' +
        '<tr>' +
          '<th style="width:22%">Resource</th>' +
          '<th style="width:10%">Type</th>' +
          '<th style="width:12%">Status</th>' +
          '<th style="width:14%">Owner / Contact</th>' +
          '<th style="width:14%">Requested By</th>' +
          '<th>Notes</th>' +
          '<th style="width:10%">Session</th>' +
        '</tr>' +
      '</thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>' +
  '</div>';
}

function summaryHTML(items) {
  var counts = {};
  items.forEach(function (it) { counts[it.status] = (counts[it.status] || 0) + 1; });
  return SUMMARY_STATUSES.map(function (s) {
    return '<div class="sum-item">' +
      '<div class="sum-num" style="color:' + s.color + '">' + (counts[s.key] || 0) + '</div>' +
      '<div class="sum-label">' + esc(s.label) + '</div>' +
    '</div>';
  }).join('');
}

(function () {
  var summaryEl = document.getElementById('summary-strip');
  var tableEl = document.getElementById('table-wrap');
  var footerEl = document.getElementById('page-footer');

  fetch('access.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      var sections = data.sections || [];
      var items = sections.reduce(function (acc, s) { return acc.concat(s.items || []); }, []);

      summaryEl.innerHTML = summaryHTML(items);
      tableEl.innerHTML = sections.map(sectionHTML).join('');
      // click a section label to collapse/expand (all-resolved sections start collapsed)
      var labels = tableEl.querySelectorAll('.section-label');
      for (var i = 0; i < labels.length; i++) {
        labels[i].addEventListener('click', function () { this.parentNode.classList.toggle('collapsed'); });
      }
      if (data.updated) {
        footerEl.textContent = 'DAS CDP · Access Tracker · Phase 0 · Conflict · Updated ' + data.updated;
      }
    })
    .catch(function () {
      tableEl.innerHTML = '<div class="table-section"><div class="section-label">Access data unavailable</div></div>';
    });
})();
</script>

</body>
</html>
