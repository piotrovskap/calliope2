<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAS CDP — Intelligence Repository</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #1D1D1D;
    --surface:   rgba(255,255,255,0.05);
    --surface2:  #1a1a1a;
    --border:    rgba(168,168,167,0.2);
    --border2:   #333333;
    --red:       #DB394C;
    --red-dim:   rgba(219,57,76,0.1);
    --text:      #F8F8F8;
    --muted:     #888;
    --dim:       #555;
    --green:     #4CAF50;
    --yellow:    #F5A623;
    --blue:      #4A7FA5;
    --purple:    #7A5BA8;
    --radius:    6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Roboto', -apple-system, sans-serif;
    font-size: 13px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ─── Header ─── */
  .topbar {
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }
  .topbar .brand svg { display: block; flex-shrink: 0; }
  .topnav a:hover { color: var(--muted) !important; }
  .topnav a.active { color: var(--text) !important; }
  .phase-badge:hover { background: rgba(219,57,76,.2); }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  /* DAS crosshair SVG logo */
  .das-logo svg {
    display: block;
  }

  .wordmark {
    font-family: 'Unica One', sans-serif;
    font-size: 16px;
    color: var(--red);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 1;
  }
  .wordmark-sub {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
    font-family: 'Roboto', sans-serif;
    font-weight: 400;
  }

  .header-stats {
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: 11px;
    color: var(--muted);
    font-family: 'Roboto Mono', monospace;
  }
  .phase-badge {
    font-family: 'Unica One', sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--red);
    border: 1px solid var(--red);
    border-radius: 3px;
    padding: 2px 8px;
    background: var(--red-dim);
  }

  /* ─── Layout ─── */
  .page { max-width: 1500px; margin: 0 auto; padding: 32px 28px 80px; }

  /* ─── Section ─── */
  .section { margin-bottom: 48px; }
  .section-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .section-label {
    font-family: 'Unica One', sans-serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .section-pill {
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1px 8px;
  }
  .section-toggle {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--dim);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .section-toggle:hover { color: var(--muted); background: var(--surface2); }
  .section-body.hidden { display: none; }

  /* ─── Session grid ─── */
  .sessions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 14px;
  }

  /* ─── Session card ─── */
  .session-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.15s;
  }
  .session-card:hover { border-color: var(--border2); }

  /* Card top bar */
  .card-topbar {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .card-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .card-type {
    font-family: 'Unica One', sans-serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 3px;
    border: 1px solid;
  }
  .type-kickoff { color: var(--purple); border-color: var(--purple); background: rgba(122,91,168,.1); }
  .type-technical-review { color: var(--blue); border-color: var(--blue); background: rgba(74,127,165,.1); }
  .card-date {
    font-family: 'Roboto Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .card-title {
    font-family: 'Unica One', sans-serif;
    font-size: 16px;
    letter-spacing: 0.03em;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .card-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .tag {
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0 5px;
  }

  /* Video */
  .card-video { background: #000; border-bottom: 1px solid var(--border); height: 175px; overflow: hidden; }
  .card-video video { width: 100%; height: 100%; display: block; object-fit: contain; }
  .card-video iframe { width: 100%; height: 100%; border: none; display: block; }
  .card-no-video {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--dim);
    font-size: 12px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  /* Attendees */
  .card-attendees {
    padding: 6px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }
  .attendee {
    font-size: 10px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 1px 6px;
  }

  /* Stats row */
  .card-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .card-stat {
    padding: 8px 0;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  .card-stat:last-child { border-right: none; }
  .stat-num {
    font-family: 'Unica One', sans-serif;
    font-size: 17px;
    line-height: 1;
    color: var(--text);
  }
  .stat-num.warn { color: var(--yellow); }
  .stat-num.danger { color: var(--red); }
  .stat-num.dim { color: var(--dim); }
  .stat-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--dim);
    margin-top: 2px;
  }

  /* Filmstrip */
  .card-filmstrip {
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    display: flex;
    gap: 0;
    background: #000;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .card-filmstrip::-webkit-scrollbar { height: 3px; }
  .card-filmstrip::-webkit-scrollbar-thumb { background: var(--border2); }
  .filmstrip-frame {
    flex-shrink: 0;
    width: 120px;
    height: 68px;
    object-fit: cover;
    border-right: 1px solid #111;
    cursor: pointer;
    opacity: 0.85;
    transition: opacity 0.1s;
  }
  .filmstrip-frame:hover { opacity: 1; }
  .filmstrip-empty {
    padding: 12px 16px;
    font-size: 11px;
    color: var(--dim);
  }

  /* Expandable content body */
  .card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }

  .card-section-label {
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--dim);
    margin-bottom: 6px;
  }

  .kp-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .kp-item {
    font-size: 12px;
    color: var(--muted);
    padding-left: 12px;
    position: relative;
    line-height: 1.4;
  }
  .kp-item::before { content: '›'; position: absolute; left: 0; color: var(--red); font-weight: 700; }
  .kp-item strong { color: var(--text); font-weight: 500; }

  .ai-list { list-style: none; display: flex; flex-direction: column; gap: 3px; }
  .ai-item {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 5px 8px;
    border-radius: 4px;
    border-left: 2px solid;
    background: var(--surface2);
    font-size: 11px;
    line-height: 1.4;
  }
  .ai-high { border-color: var(--red); }
  .ai-medium { border-color: var(--yellow); }
  .ai-low { border-color: var(--dim); }
  .ai-priority {
    font-family: 'Roboto Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    white-space: nowrap;
    padding-top: 1px;
  }
  .p-high { color: var(--red); }
  .p-medium { color: var(--yellow); }
  .p-low { color: var(--dim); }
  .ai-text { color: var(--muted); flex: 1; }
  .ai-assignee { color: var(--blue); font-style: italic; }

  /* Scrollable inner */
  .scrollable { max-height: 110px; overflow-y: auto; }
  .scrollable::-webkit-scrollbar { width: 3px; }
  .scrollable::-webkit-scrollbar-thumb { background: var(--border2); }

  /* Card footer */
  .card-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .card-link {
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    text-decoration: none;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 4px 10px;
    transition: border-color 0.1s, color 0.1s;
    font-family: 'Roboto', sans-serif;
  }
  .card-link:hover { border-color: var(--red); color: var(--red); }
  .card-link.primary { border-color: var(--red); color: var(--red); background: var(--red-dim); }
  .card-link.primary:hover { background: rgba(219,57,76,.2); }

  /* ─── Artifacts grid ─── */
  .artifacts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .artifact-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s;
    cursor: pointer;
  }
  .artifact-card:hover { border-color: var(--border2); }
  .artifact-card.unavailable { opacity: 0.45; cursor: default; }
  .artifact-icon {
    font-family: 'Roboto Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .08em;
    color: var(--red);
    background: var(--red-dim);
    border: 1px solid rgba(219,57,76,.25);
    border-radius: 4px;
    padding: 3px 8px;
    align-self: flex-start;
    line-height: 1.6;
  }
  .artifact-title {
    font-family: 'Unica One', sans-serif;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--text);
    line-height: 1.2;
  }
  .artifact-desc { font-size: 11px; color: var(--muted); line-height: 1.5; flex: 1; }
  .artifact-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    margin-top: auto;
  }
  .artifact-type-label {
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .atype-diagram { color: var(--green); }
  .atype-catalog { color: var(--yellow); }
  .atype-knowledge-graph { color: var(--purple); }
  .atype-document { color: var(--blue); }
  .artifact-date {
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    color: var(--dim);
  }
  .artifact-pending { color: var(--red); font-size: 10px; font-family: 'Roboto Mono', monospace; }

  /* ─── Important Links ─── */
  .links-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .link-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s;
    min-width: 220px;
  }
  .link-card:hover { border-color: var(--red); }
  .link-icon { font-size: 18px; flex-shrink: 0; }
  .link-label {
    font-family: 'Unica One', sans-serif;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--text);
    line-height: 1.2;
  }
  .link-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* Artifact reference chips in session cards */
  .card-artifact-refs { padding: 0; }
  .artifact-ref {
    display: inline-block;
    font-size: 11px;
    color: var(--red);
    text-decoration: none;
    background: var(--red-dim);
    border: 1px solid rgba(219,57,76,.3);
    border-radius: 3px;
    padding: 2px 8px;
    transition: border-color 0.1s, background 0.1s;
  }
  .artifact-ref:hover { border-color: var(--red); background: rgba(219,57,76,.2); }

  /* ─── Lightbox ─── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 85vh; border: 1px solid var(--border2); border-radius: 4px; }
  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 24px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
  }
  .lightbox-close:hover { color: var(--text); }
  .lightbox-label { font-size: 12px; color: var(--muted); font-family: 'Roboto Mono', monospace; }
</style>
</head>

<!-- Main -->
<div class="page">

  <!-- Sessions -->
  <div class="section">
    <div class="section-head">
      <span class="section-label">Sessions</span>
      <span class="section-pill" id="sessions-pill">0</span>
      <button class="section-toggle" onclick="toggleSection(this)">▾</button>
    </div>
    <div class="section-body" id="sessions-body">
      <div class="sessions-grid" id="sessions-grid">
        <div style="color:var(--dim);font-size:12px;padding:8px 0;">Loading sessions…</div>
      </div>
    </div>
  </div>

  <!-- Knowledge Base -->
  <div class="section">
    <div class="section-head">
      <span class="section-label">Knowledge Base</span>
      <span class="section-pill" id="artifacts-pill">0</span>
      <button class="section-toggle" onclick="toggleSection(this)">▾</button>
    </div>
    <div class="section-body" id="artifacts-body">
      <div class="artifacts-grid" id="artifacts-grid">
        <div style="color:var(--dim);font-size:12px;padding:8px 0;">Loading artifacts…</div>
      </div>
    </div>
  </div>

  <!-- Important Links -->
  <div class="section">
    <div class="section-head">
      <span class="section-label">Important Links</span>
    </div>
    <div class="section-body">
      <div class="links-grid">
        <a class="link-card" href="../app/index.html" target="_blank">
          <span class="link-icon">KG</span>
          <div>
            <div class="link-label">Global Knowledge Graph</div>
            <div class="link-sub">D3 entity graph — all sessions combined</div>
          </div>
        </a>
      </div>
    </div>
  </div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="document.getElementById('lightbox').classList.remove('open')">✕</button>
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-label" id="lightbox-label"></div>
</div>

<script>
// ─── Utilities ───────────────────────────────────────────
async function load(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return r.json();
  } catch { return null; }
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleSection(btn) {
  const body = btn.closest('.section').querySelector('.section-body');
  body.classList.toggle('hidden');
  btn.textContent = body.classList.contains('hidden') ? '▸' : '▾';
}

function openLightbox(src, label) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-label').textContent = label;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(e) {
  if (e.target === document.getElementById('lightbox')) {
    document.getElementById('lightbox').classList.remove('open');
  }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

// ─── Session card ─────────────────────────────────────────
function typeClass(t) {
  return 'type-' + (t || 'kickoff');
}
function typeLabel(t) {
  return { 'kickoff': 'Kickoff', 'technical-review': 'Technical Review' }[t] || t;
}
function priorityClass(p) {
  const m = { high: 'ai-high', medium: 'ai-medium', low: 'ai-low' };
  return m[(p||'low').toLowerCase()] || 'ai-low';
}
function priorityLabelClass(p) {
  const m = { high: 'p-high', medium: 'p-medium', low: 'p-low' };
  return m[(p||'low').toLowerCase()] || 'p-low';
}

function renderFilmstrip(sessionFolder, manifest) {
  if (!manifest) return '<div class="filmstrip-empty">No frames available</div>';
  const total = manifest.stats?.frames_extracted || 0;
  if (total === 0) return '<div class="filmstrip-empty">No frames captured</div>';

  // Sample evenly: aim for ~18 frames in the strip
  const step = Math.max(1, Math.floor(total / 18));
  const frames = [];
  for (let i = 0; i < total; i += step) {
    const name = 'frame_' + String(i).padStart(4, '0') + '.jpg';
    const src = `sessions/${sessionFolder}/frames/${name}`;
    frames.push(`<img class="filmstrip-frame" src="${src}" alt="frame ${i}"
      onerror="this.style.display='none'"
      onclick="openLightbox('${src}', '${sessionFolder} · frame ${i}')"
      onerror="this.style.display='none'">`);
  }
  return frames.join('');
}

function renderKeyPoints(kps, sessionId) {
  if (!kps?.length) return '';
  const shown = kps.slice(0, 5);
  const rest = kps.length - shown.length;
  const detailUrl = `session.html?id=${encodeURIComponent(sessionId)}#key-points`;
  return `<div>
    <div class="card-section-label">Key Points</div>
    <ul class="kp-list scrollable">
      ${shown.map(k => `<li class="kp-item"><strong>${esc(k.point)}</strong> — ${esc(k.details || '')}</li>`).join('')}
      ${rest > 0 ? `<li class="kp-item"><a href="${detailUrl}" style="color:var(--red);text-decoration:none;">+${rest} more →</a></li>` : ''}
    </ul>
  </div>`;
}

function renderActions(ais, sessionId) {
  if (!ais?.length) return '';
  const shown = ais.slice(0, 5);
  const rest = ais.length - shown.length;
  const detailUrl = `session.html?id=${encodeURIComponent(sessionId)}#action-items`;
  return `<div>
    <div class="card-section-label">Action Items</div>
    <ul class="ai-list scrollable">
      ${shown.map(a => `
        <li class="ai-item ${priorityClass(a.priority)}">
          <span class="ai-priority ${priorityLabelClass(a.priority)}">${(a.priority||'LOW').toUpperCase()}</span>
          <span class="ai-text">${esc(a.action)}${a.assignee ? ` <span class="ai-assignee">(${esc(a.assignee)})</span>` : ''}</span>
        </li>`).join('')}
      ${rest > 0 ? `<li class="ai-item" style="border-color:var(--border)"><span class="ai-text"><a href="${detailUrl}" style="color:var(--red);text-decoration:none;">+${rest} more →</a></span></li>` : ''}
    </ul>
  </div>`;
}

function durationStr(secs) {
  if (!secs) return '—';
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return `${m}m ${String(s).padStart(2,'0')}s`;
}

async function buildSessionCard(id) {
  const base = `sessions/${id}`;
  const [sess, manifest, kps, ais] = await Promise.all([
    load(`${base}/session.json`),
    load(`${base}/manifest.json`),
    load(`${base}/results/key_points.json`),
    load(`${base}/results/action_items.json`),
  ]);

  if (!sess) return `<div class="session-card" style="padding:16px;color:var(--dim)">Could not load: ${esc(id)}</div>`;

  const kpCount = kps?.length || 0;
  const aiCount = ais?.length || 0;
  const highCount = ais?.filter(a => (a.priority||'').toLowerCase() === 'high').length || 0;
  const duration = manifest?.video?.duration_seconds;
  const framesTotal = manifest?.stats?.frames_extracted || 0;

  const driveId = sess.video_drive ? (sess.video_drive.match(/\/d\/([a-zA-Z0-9_-]+)/)||[])[1] : null;
  const videoHtml = driveId
    ? `<div class="card-video"><iframe src="https://drive.google.com/file/d/${driveId}/preview" allowfullscreen allow="autoplay"></iframe></div>`
    : sess.video
      ? `<div class="card-video"><video controls preload="metadata" controlsList="nodownload">
          <source src="${sess.video}" type="video/mp4"></video></div>`
      : `<div class="card-no-video">▭ No recording</div>`;

  const detailUrl = `session.html?id=${encodeURIComponent(id)}`;

  const links = [];
  links.push(`<a class="card-link primary" href="${detailUrl}">Open Session →</a>`);
  if (sess.synthesis) links.push(`<a class="card-link" href="${sess.synthesis}" target="_blank">Synthesis</a>`);
  links.push(`<a class="card-link" href="${base}/results/analysis.html" target="_blank">Analysis & KG</a>`);
  // frames are gitignored (large media) — screencaps link omitted

  // Resolve artifact titles for inline reference chips
  const artifactIds = sess.artifacts || [];
  let artifactChips = '';
  if (artifactIds.length > 0) {
    const artData = await Promise.all(artifactIds.map(aid => load(`artifacts/${aid}.json`)));
    const chips = artData.filter(Boolean).map(a =>
      `<a class="artifact-ref" href="${a.href || '#'}" target="_blank">${esc(a.icon || '')} ${esc(a.title)}</a>`
    );
    if (chips.length) {
      artifactChips = `<div class="card-artifact-refs">
        <div class="card-section-label" style="margin-bottom:5px;">Produced Artifacts</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;">${chips.join('')}</div>
      </div>`;
    }
  }

  return `
  <div class="session-card" style="cursor:pointer;" onclick="location.href='${detailUrl}'">
    <div class="card-topbar">
      <div class="card-meta-row">
        <span class="card-type ${typeClass(sess.type)}">${typeLabel(sess.type)}</span>
        <span class="card-date">${sess.date}</span>
      </div>
      <div class="card-title">${esc(sess.title)}</div>
      <div class="card-desc">${esc(sess.description)}</div>
      <div class="card-tags">${(sess.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div>
    ${videoHtml}
    <div class="card-attendees">${(sess.attendees||[]).map(a => `<span class="attendee">${esc(a)}</span>`).join('')}</div>
    <div class="card-stats">
      <div class="card-stat">
        <div class="stat-num">${kpCount || '<span class="dim">—</span>'}</div>
        <div class="stat-label">Key Points</div>
      </div>
      <div class="card-stat">
        <div class="stat-num ${aiCount > 0 ? 'warn' : 'dim'}">${aiCount || '—'}</div>
        <div class="stat-label">Actions</div>
      </div>
      <div class="card-stat">
        <div class="stat-num ${highCount > 0 ? 'danger' : 'dim'}">${highCount || '—'}</div>
        <div class="stat-label">High Priority</div>
      </div>
      <div class="card-stat">
        <div class="stat-num dim" style="font-size:14px">${durationStr(duration)}</div>
        <div class="stat-label">Duration</div>
      </div>
    </div>
    <div class="card-body" onclick="event.stopPropagation()">
      ${renderKeyPoints(kps, id)}
      ${renderActions(ais, id)}
      ${artifactChips}
    </div>
    <div class="card-footer" onclick="event.stopPropagation()">${links.join('')}</div>
  </div>`;
}

// ─── Artifact card ───────────────────────────────────────
function artifactTypeClass(t) {
  return 'atype-' + t;
}

async function buildArtifactCard(id) {
  const art = await load(`artifacts/${id}.json`);
  if (!art) return '';

  const tag = art.href ? 'a' : 'div';
  const href = art.href ? `href="${art.href}" target="_blank"` : '';
  const cls = art.href ? '' : 'unavailable';

  return `<${tag} class="artifact-card ${cls}" ${href}>
    <div class="artifact-icon">${esc(art.icon)}</div>
    <div class="artifact-title">${esc(art.title)}</div>
    <div class="artifact-desc">${esc(art.description)}</div>
    <div class="artifact-footer">
      <span class="artifact-type-label ${artifactTypeClass(art.type)}">${(art.type||'').replace('-',' ')}</span>
      ${art.updated
        ? `<span class="artifact-date">${art.updated}</span>`
        : `<span class="artifact-pending">pending</span>`}
    </div>
  </${tag}>`;
}

// ─── Init ────────────────────────────────────────────────
async function init() {
  const catalog = await load('catalog.json');
  if (!catalog) { document.getElementById('sessions-grid').innerHTML = '<div style="color:var(--red)">catalog.json not found</div>'; return; }

  const { sessions = [], artifacts = [], project = {} } = catalog;

  const setText = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  setText('hdr-sessions', sessions.length + ' session' + (sessions.length !== 1 ? 's' : ''));
  setText('hdr-artifacts', artifacts.length + ' artifact' + (artifacts.length !== 1 ? 's' : ''));
  setText('hdr-phase', 'PHASE ' + (project.phase || '0'));
  setText('sessions-pill', sessions.length);
  setText('artifacts-pill', artifacts.length);

  const [sessionCards, artifactCards] = await Promise.all([
    Promise.all(sessions.map(buildSessionCard)),
    Promise.all(artifacts.map(buildArtifactCard)),
  ]);

  document.getElementById('sessions-grid').innerHTML = sessionCards.join('') || '<div style="color:var(--dim)">No sessions</div>';
  document.getElementById('artifacts-grid').innerHTML = artifactCards.join('') || '<div style="color:var(--dim)">No artifacts</div>';
}

init();
</script>
</body>
</html>
