<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session — DAS CDP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unica+One&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1D1D1D; --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.08);
    --border:rgba(168,168,167,.2); --border2:rgba(236,239,245,.15);
    --red:#DB394C; --red-dim:rgba(219,57,76,.1);
    --text:#FFFFFF; --muted:#A8A8A7; --dim:rgba(255,255,255,.3); --green:#4CAF50; --yellow:#F5A623;
    --blue:#4A7FA5; --purple:#7A5BA8; --radius:6px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Roboto',sans-serif; font-size:13px; line-height:1.6; min-height:100vh; }

  /* ── Portal nav ── */
  .portal-nav {
    background:var(--surface2); border-bottom:1px solid var(--border);
    padding:0 28px; height:34px; display:flex; align-items:center; gap:0;
    font-size:11px; font-family:'Roboto Mono',monospace;
  }
  .portal-nav a { color:var(--dim); text-decoration:none; }
  .portal-nav a:hover { color:var(--muted); }
  .portal-nav .sep { color:var(--border2); margin:0 10px; }
  .portal-nav .active { color:var(--red); }

  /* ── Header ── */
  .header {
    border-bottom:1px solid var(--border); padding:0 28px; height:54px;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg); position:sticky; top:0; z-index:100;
  }
  .brand { display:flex; align-items:center; gap:14px; }
  .wordmark { font-family:'Unica One',sans-serif; font-size:16px; color:var(--red); letter-spacing:.1em; text-transform:uppercase; line-height:1; }
  .wordmark-sub { font-size:10px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:2px; }
  .back-btn { font-size:11px; color:var(--muted); text-decoration:none; border:1px solid var(--border); border-radius:4px; padding:4px 12px; font-family:'Roboto',sans-serif; }
  .back-btn:hover { color:var(--text); border-color:var(--border2); }

  /* ── Layout ── */
  .page { max-width:1400px; margin:0 auto; padding:0 28px 80px; }

  /* ── Session header block ── */
  .session-hero {
    padding:28px 0 24px;
    border-bottom:1px solid var(--border);
    margin-bottom:28px;
  }
  .session-meta-row {
    display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;
  }
  .session-type {
    font-family:'Unica One',sans-serif; font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; padding:2px 8px; border-radius:3px; border:1px solid;
  }
  .type-kickoff { color:var(--purple); border-color:var(--purple); background:rgba(122,91,168,.1); }
  .type-technical-review { color:var(--blue); border-color:var(--blue); background:rgba(74,127,165,.1); }
  .session-date { font-family:'Roboto Mono',monospace; font-size:12px; color:var(--muted); }
  .session-id { font-family:'Roboto Mono',monospace; font-size:10px; color:var(--dim); }

  .session-title {
    font-family:'Unica One',sans-serif; font-size:32px; letter-spacing:.02em;
    color:var(--text); line-height:1.1; margin-bottom:8px;
  }
  .session-desc { font-size:13px; color:var(--muted); line-height:1.6; max-width:700px; margin-bottom:12px; }
  .session-tags { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:14px; }
  .tag { font-family:'Roboto Mono',monospace; font-size:10px; color:var(--dim); background:var(--surface2); border:1px solid var(--border); border-radius:3px; padding:0 6px; }

  .attendees { display:flex; flex-wrap:wrap; gap:4px; }
  .attendee { font-size:11px; color:var(--muted); background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:2px 9px; }

  /* ── Stats strip ── */
  .stats-strip {
    display:grid; grid-template-columns:repeat(4,1fr);
    border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; margin-bottom:28px;
  }
  .stat { padding:16px; text-align:center; background:var(--surface); border-right:1px solid var(--border); }
  .stat:last-child { border-right:none; }
  .stat-num { font-family:'Unica One',sans-serif; font-size:28px; line-height:1; }
  .stat-num.ok { color:var(--text); }
  .stat-num.warn { color:var(--yellow); }
  .stat-num.danger { color:var(--red); }
  .stat-num.dim { color:var(--dim); font-size:20px; }
  .stat-label { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin-top:4px; }

  /* ── Two-column body ── */
  .body-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:28px;
  }
  @media (max-width:900px) { .body-grid { grid-template-columns:1fr; } }

  /* ── Video ── */
  .video-section { margin-bottom:28px; }
  .video-wrap {
    background:#000; border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden; aspect-ratio:16/9; position:relative;
  }
  .video-wrap video { width:100%; height:100%; display:block; }
  .video-wrap iframe { width:100%; height:100%; border:none; display:block; }
  .video-unavail {
    width:100%; height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px;
    color:var(--dim); font-size:13px; background:var(--surface2);
  }
  .video-unavail-icon { font-size:32px; }

  /* ── Filmstrip ── */
  .filmstrip-section { margin-bottom:28px; }
  .filmstrip {
    display:flex; gap:2px; overflow-x:auto; background:#000;
    border:1px solid var(--border); border-radius:var(--radius);
    padding:2px; scrollbar-width:thin; scrollbar-color:var(--border2) transparent;
  }
  .filmstrip::-webkit-scrollbar { height:4px; }
  .filmstrip::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
  .filmstrip img {
    flex-shrink:0; height:80px; width:auto; object-fit:cover;
    cursor:pointer; opacity:.8; transition:opacity .1s; border-radius:2px;
  }
  .filmstrip img:hover { opacity:1; }

  /* ── Section label ── */
  .section-head {
    font-family:'Unica One',sans-serif; font-size:12px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted); margin-bottom:12px;
    padding-bottom:8px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .section-count { font-family:'Roboto Mono',monospace; font-size:10px; color:var(--dim); font-weight:400; }

  /* ── Key points ── */
  .kp-list { list-style:none; display:flex; flex-direction:column; gap:6px; }
  .kp-item {
    padding:8px 10px 8px 14px; position:relative;
    font-size:12px; color:var(--muted); line-height:1.5;
    background:var(--surface); border:1px solid var(--border); border-radius:4px;
  }
  .kp-item::before { content:'›'; position:absolute; left:5px; color:var(--red); font-weight:700; }
  .kp-item strong { color:var(--text); font-weight:500; display:block; margin-bottom:2px; font-size:12px; }

  /* ── Action items ── */
  .ai-list { list-style:none; display:flex; flex-direction:column; gap:4px; }
  .ai-item {
    display:flex; gap:8px; align-items:flex-start;
    padding:8px 10px; border-radius:4px; border-left:2px solid;
    background:var(--surface); font-size:12px; line-height:1.4;
  }
  .ai-high { border-color:var(--red); }
  .ai-medium { border-color:var(--yellow); }
  .ai-low { border-color:var(--dim); }
  .ai-priority { font-family:'Roboto Mono',monospace; font-size:9px; font-weight:700; text-transform:uppercase; white-space:nowrap; padding-top:1px; }
  .p-high { color:var(--red); }
  .p-medium { color:var(--yellow); }
  .p-low { color:var(--dim); }
  .ai-text { color:var(--muted); flex:1; }
  .ai-owner { color:var(--blue); font-style:italic; }

  /* ── Artifacts ── */
  .artifacts-section { margin-bottom:28px; }
  .artifact-chips { display:flex; flex-wrap:wrap; gap:8px; }
  .artifact-chip {
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    text-decoration:none; color:inherit; transition:border-color .15s;
  }
  .artifact-chip:hover { border-color:var(--red); }
  .artifact-chip-icon { font-size:16px; }
  .artifact-chip-label { font-family:'Unica One',sans-serif; font-size:13px; color:var(--text); }
  .artifact-chip-type { font-family:'Roboto Mono',monospace; font-size:9px; color:var(--dim); }

  /* ── Links bar ── */
  .links-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:28px; }
  .link-btn {
    font-size:12px; color:var(--text); text-decoration:none;
    background:var(--surface2); border:1px solid var(--border2);
    border-radius:4px; padding:6px 14px; transition:border-color .1s, color .1s;
  }
  .link-btn:hover { border-color:var(--red); color:var(--red); }
  .link-btn.primary { border-color:var(--red); color:var(--red); background:var(--red-dim); }
  .link-btn.primary:hover { background:rgba(219,57,76,.2); }

  /* ── Lightbox ── */
  .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.94); z-index:1000; align-items:center; justify-content:center; flex-direction:column; gap:10px; }
  .lightbox.open { display:flex; }
  .lightbox img { max-width:92vw; max-height:87vh; border:1px solid var(--border2); border-radius:4px; }
  .lightbox-close { position:absolute; top:18px; right:22px; background:none; border:none; color:var(--muted); font-size:24px; cursor:pointer; }
  .lightbox-close:hover { color:var(--text); }
  .lightbox-caption { font-family:'Roboto Mono',monospace; font-size:11px; color:var(--muted); }

  .error-state { padding:60px 28px; text-align:center; color:var(--dim); font-size:13px; }
</style>
</head>
<body>

<!-- Portal nav -->
<nav class="portal-nav">
  <a href="../">Home</a>
  <span class="sep">/</span>
  <a href="index.html">Repository</a>
  <span class="sep">/</span>
  <span class="active" id="nav-title">Session</span>
</nav>

<!-- Header -->
<header class="header">
  <div class="brand">
    <a href="/" aria-label="Home" style="display:inline-flex;line-height:0"><svg width="80" height="21" viewBox="0 0 141 37" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.76011 3.9038C5.92786 3.74184 4.10895 4.35124 2.69056 5.6021C2.11733 6.19678 1.66843 6.91459 1.37363 7.70833C1.07884 8.50207 0.944757 9.35363 0.980235 10.2068V25.8829C0.944276 26.744 1.08103 27.6033 1.38128 28.4032C1.68152 29.203 2.13834 29.9249 2.72104 30.5204C4.16802 31.7349 5.9866 32.3289 7.82125 32.186C9.65242 32.3376 11.4679 31.7295 12.8909 30.4878C13.4641 29.8931 13.9129 29.1752 14.2077 28.3814C14.5025 27.5877 14.6366 26.7361 14.6011 25.8829V22.911H10.5088V25.8829C10.5269 26.1963 10.4816 26.5101 10.3763 26.8031C10.2709 27.0962 10.1077 27.3615 9.89795 27.5811C9.29929 28.0511 8.56102 28.2717 7.82125 28.2016C7.06115 28.2882 6.29829 28.0668 5.68342 27.5811C5.47026 27.3642 5.30488 27.0992 5.19924 26.8055C5.0936 26.5118 5.05041 26.1967 5.07267 25.8829V10.2068C5.05065 9.89591 5.09096 9.58361 5.19104 9.29072C5.29111 8.99783 5.44865 8.73115 5.65294 8.50864C6.25972 8.0309 7.01016 7.80989 7.76011 7.88813C8.52022 7.80157 9.28308 8.023 9.89795 8.50864C10.1077 8.72828 10.2709 8.99361 10.3763 9.28663C10.4816 9.57966 10.5269 9.89349 10.5088 10.2068V14.7464H14.6011V10.2068C14.6348 9.34798 14.4939 8.49156 14.1881 7.69657C13.8823 6.90158 13.4188 6.18702 12.8298 5.6021C11.4067 4.3604 9.59128 3.7522 7.76011 3.9038Z" fill="white"/><path d="M55.2655 21.0496L48.4551 4.52451H44.7598V31.631H48.8521V15.0732L55.632 31.631H59.3579V4.52451H55.2655V21.0496Z" fill="white"/><path d="M64.1953 31.631H68.2877V19.8739H74.3346V15.8896H68.2877V8.47617H75.8005V4.52451H64.1953V31.631Z" fill="white"/><path d="M84.731 4.52451H80.6387V31.631H91.4498V27.6466H84.731V4.52451Z" fill="white"/><path d="M96.2871 8.47617H98.1195V27.6466H96.2871V31.631H104.044V27.6466H102.212V8.47617H104.044V4.52451H96.2871V8.47617Z" fill="white"/><path d="M115.64 3.90374C113.817 3.74697 112.01 4.35626 110.601 5.60204C110.022 6.19287 109.57 6.91008     <span style="color:var(--dim);margin:0 8px">×</span>
    <span style="font-family:'Unica One',sans-serif;font-size:13px;color:var(--muted);letter-spacing:.06em" id="header-sub">DAS CDP</span>
  </div>
  <a class="back-btn" href="index.html">← Sessions</a>
</header>

<div class="page" id="page-root">
  <div class="error-state">Loading session…</div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLb()">
  <button class="lightbox-close" onclick="closeLb()">✕</button>
  <img id="lb-img" src="" alt="">
  <div class="lightbox-caption" id="lb-caption"></div>
</div>

<script>
// ── Helpers ──────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
async function load(url) {
  try { const r = await fetch(url); return r.ok ? r.json() : null; } catch { return null; }
}
function openLb(src, caption) {
  document.getElementById('lb-img').src = src;
  document.getElementById('lb-caption').textContent = caption;
  document.getElementById('lightbox').classList.add('open');
}
function closeLb() { document.getElementById('lightbox').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key==='Escape') closeLb(); });

function typeClass(t) { return 'type-'+(t||'kickoff'); }
function typeLabel(t) { return {'kickoff':'Kickoff','technical-review':'Technical Review'}[t]||t; }
function priorityClass(p) { return {high:'ai-high',medium:'ai-medium',low:'ai-low'}[(p||'low').toLowerCase()]||'ai-low'; }
function priorityLabelClass(p) { return {high:'p-high',medium:'p-medium',low:'p-low'}[(p||'low').toLowerCase()]||'p-low'; }
function durationStr(s) { if(!s) return '—'; return Math.floor(s/60)+'m '+String(Math.floor(s%60)).padStart(2,'0')+'s'; }

// ── Drive embed URL ───────────────────────────────────────────────────
// Accepts: full Drive URL or file ID
function driveEmbedUrl(url) {
  if (!url) return null;
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  const id = m ? m[1] : url;
  return `https://drive.google.com/file/d/${id}/preview`;
}

// ── Filmstrip ─────────────────────────────────────────────────────────
function buildFilmstrip(sessionId, totalFrames) {
  if (!totalFrames) return '<div style="padding:16px;color:var(--dim);font-size:12px;">No frames captured</div>';
  const frames = [];
  for (let i = 0; i < totalFrames; i++) {
    const name = 'frame_' + String(i).padStart(4,'0') + '.jpg';
    const src = `sessions/${sessionId}/frames/${name}`;
    frames.push(`<img src="${src}" alt="frame ${i}" loading="lazy"
      onclick="openLb('${src}','${esc(sessionId)} · frame ${i}')"
      onerror="this.style.display='none'">`);
  }
  return frames.join('');
}

// ── Key points ───────────────────────────────────────────────────────
function buildKPs(kps) {
  if (!kps?.length) return '<div style="color:var(--dim);font-size:12px;padding:8px 0;">No key points extracted</div>';
  return `<ul class="kp-list">${kps.map(k=>`
    <li class="kp-item">
      <strong>${esc(k.point)}</strong>
      ${k.details ? esc(k.details) : ''}
    </li>`).join('')}</ul>`;
}

// ── Action items ─────────────────────────────────────────────────────
function buildAIs(ais) {
  if (!ais?.length) return '<div style="color:var(--dim);font-size:12px;padding:8px 0;">No action items extracted</div>';
  return `<ul class="ai-list">${ais.map(a=>`
    <li class="ai-item ${priorityClass(a.priority)}">
      <span class="ai-priority ${priorityLabelClass(a.priority)}">${(a.priority||'LOW').toUpperCase()}</span>
      <span class="ai-text">${esc(a.action)}${a.assignee?` <span class="ai-owner">(${esc(a.assignee)})</span>`:''}</span>
    </li>`).join('')}</ul>`;
}

// ── Main ─────────────────────────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  if (!id) {
    document.getElementById('page-root').innerHTML =
      '<div class="error-state">No session ID provided. Add <code>?id=session-id</code> to the URL.</div>';
    return;
  }

  const base = `sessions/${id}`;

  const [sess, manifest, kps, ais] = await Promise.all([
    load(`${base}/session.json`),
    load(`${base}/manifest.json`),
    load(`${base}/results/key_points.json`),
    load(`${base}/results/action_items.json`),
  ]);

  if (!sess) {
    document.getElementById('page-root').innerHTML =
      `<div class="error-state">Session not found: <code>${esc(id)}</code></div>`;
    return;
  }

  // Update nav + header
  document.title = `${sess.title} — DAS CDP`;
  document.getElementById('nav-title').textContent = sess.title;
  document.getElementById('header-sub').textContent = sess.date;

  const kpCount = kps?.length || 0;
  const aiCount = ais?.length || 0;
  const highCount = ais?.filter(a=>(a.priority||'').toLowerCase()==='high').length || 0;
  const totalFrames = manifest?.stats?.frames_extracted || 0;
  const duration = manifest?.video?.duration_seconds;

  // Resolve artifacts
  let artifactCards = '';
  if (sess.artifacts?.length) {
    const artData = await Promise.all(sess.artifacts.map(aid => load(`artifacts/${aid}.json`)));
    const chips = artData.filter(Boolean).map(a => {
      const tag = a.href ? 'a' : 'div';
      const href = a.href ? `href="${esc(a.href)}" target="_blank"` : '';
      return `<${tag} class="artifact-chip" ${href}>
        <span class="artifact-chip-icon">${esc(a.icon||'')}</span>
        <div>
          <div class="artifact-chip-label">${esc(a.title)}</div>
          <div class="artifact-chip-type">${esc((a.type||'').replace('-',' '))}</div>
        </div>
      </${tag}>`;
    });
    artifactCards = chips.join('');
  }

  // Video
  let videoHtml;
  if (sess.video_drive) {
    const embedUrl = driveEmbedUrl(sess.video_drive);
    videoHtml = `<div class="video-wrap"><iframe src="${embedUrl}" allowfullscreen allow="autoplay"></iframe></div>`;
  } else if (sess.video) {
    videoHtml = `<div class="video-wrap"><video controls preload="metadata">
      <source src="${esc(sess.video)}" type="video/mp4">
    </video></div>`;
  } else {
    videoHtml = `<div class="video-wrap"><div class="video-unavail">
      <div class="video-unavail-icon">▭</div>
      <div>No recording available</div>
      <div style="font-size:11px;color:var(--border2)">Add a Google Drive URL to session.json → video_drive</div>
    </div></div>`;
  }

  // Links
  const links = [];
  if (sess.synthesis) links.push(`<a class="link-btn primary" href="${esc(sess.synthesis)}" target="_blank">Synthesis & Diagrams</a>`);
  links.push(`<a class="link-btn" href="${base}/results/analysis.html" target="_blank">Analysis & KG</a>`);
  links.push(`<a class="link-btn" href="${base}/transcript/transcript.txt" target="_blank">Transcript</a>`);
  if (totalFrames > 0) links.push(`<a class="link-btn" href="${base}/frames/" target="_blank">All Frames (${totalFrames})</a>`);

  document.getElementById('page-root').innerHTML = `

    <!-- Session hero -->
    <div class="session-hero">
      <div class="session-meta-row">
        <span class="session-type ${typeClass(sess.type)}">${typeLabel(sess.type)}</span>
        <span class="session-date">${esc(sess.date)}</span>
        <span class="session-id">${esc(id)}</span>
      </div>
      <div class="session-title">${esc(sess.title)}</div>
      <div class="session-desc">${esc(sess.description)}</div>
      <div class="session-tags">${(sess.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="attendees">${(sess.attendees||[]).map(a=>`<span class="attendee">${esc(a)}</span>`).join('')}</div>
    </div>

    <!-- Stats -->
    <div class="stats-strip">
      <div class="stat">
        <div class="stat-num ok">${kpCount||'—'}</div>
        <div class="stat-label">Key Points</div>
      </div>
      <div class="stat">
        <div class="stat-num ${aiCount?'warn':'dim'}">${aiCount||'—'}</div>
        <div class="stat-label">Action Items</div>
      </div>
      <div class="stat">
        <div class="stat-num ${highCount?'danger':'dim'}">${highCount||'—'}</div>
        <div class="stat-label">High Priority</div>
      </div>
      <div class="stat">
        <div class="stat-num dim">${durationStr(duration)}</div>
        <div class="stat-label">Duration</div>
      </div>
    </div>

    <!-- Links -->
    <div class="links-bar">${links.join('')}</div>

    <!-- Video -->
    <div class="video-section" id="recording">
      <div class="section-head">Recording</div>
      ${videoHtml}
    </div>

    <!-- Full filmstrip -->
    ${totalFrames > 0 ? `
    <div class="filmstrip-section" id="screencaps">
      <div class="section-head">
        Screencaps
        <span class="section-count">${totalFrames} frames</span>
      </div>
      <div class="filmstrip">${buildFilmstrip(id, totalFrames)}</div>
    </div>` : ''}

    <!-- KPs + Actions -->
    <div class="body-grid">
      <div id="key-points">
        <div class="section-head">
          Key Points
          <span class="section-count">${kpCount}</span>
        </div>
        ${buildKPs(kps)}
      </div>
      <div id="action-items">
        <div class="section-head">
          Action Items
          <span class="section-count">${aiCount}</span>
        </div>
        ${buildAIs(ais)}
      </div>
    </div>

    <!-- Produced artifacts -->
    ${artifactCards ? `
    <div class="artifacts-section" id="artifacts">
      <div class="section-head">Produced Artifacts</div>
      <div class="artifact-chips">${artifactCards}</div>
    </div>` : ''}
  `;
}

init();
</script>
</body>
</html>
